<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Билеты к сессии</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: single column, phone-first; ticket strip on top of the quiz like exam tickets */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#15202b; --muted:#5b6b7a; --line:#d5dde5;
  --accent:#1f4e8c; --accent-ink:#ffffff; --accent-soft:#dfe8f5;
  --ok:#1d8a4a; --ok-soft:#dcf2e4; --bad:#c8352c; --bad-soft:#fbe1de; --new:#c9d2dc; --on-sem:#ffffff;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#18212b; --ink:#e7edf3; --muted:#93a3b3; --line:#2a3744;
  --accent:#6ea1e6; --accent-ink:#0b1420; --accent-soft:#1d2c3f;
  --ok:#3fbf73; --ok-soft:#163223; --bad:#ef6b61; --bad-soft:#3a1d1b; --new:#34424f; --on-sem:#0b1420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#18212b; --ink:#e7edf3; --muted:#93a3b3; --line:#2a3744;
  --accent:#6ea1e6; --accent-ink:#0b1420; --accent-soft:#1d2c3f;
  --ok:#3fbf73; --ok-soft:#163223; --bad:#ef6b61; --bad-soft:#3a1d1b; --new:#34424f; --on-sem:#0b1420; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.5rem}
h2{font-size:1.05rem}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* home */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px 16px;font-weight:600;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%}
.primary:disabled{opacity:.45;cursor:default}
.subject{display:flex;flex-direction:column;gap:8px}
.subject-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.link{color:var(--accent);font-weight:600;font-size:.9rem;padding:4px 0}
.deck{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.deck-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.deck-title{font-weight:600;min-width:0}
.deck-count{font-size:.85rem;color:var(--muted);white-space:nowrap}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--new)}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)}
.legend{font-size:.8rem;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px}

/* deck screen */
.top{display:flex;align-items:center;gap:10px}
.back{padding:8px 10px;margin-left:-10px;border-radius:8px;color:var(--accent);font-weight:600}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%}
.mode:disabled{opacity:.45;cursor:default}
.mode strong{display:block}
.mode small{color:var(--muted);font-size:.85rem}
.mode .arrow{color:var(--accent);font-size:1.2rem}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.cell{flex:0 0 auto;min-width:30px;height:30px;border-radius:6px;background:var(--new);color:var(--ink);font-size:.8rem;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums;padding:0 4px}
.cell.ok{background:var(--ok);color:var(--on-sem)} .cell.bad{background:var(--bad);color:var(--on-sem)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.qtext{font-size:1.12rem;font-weight:600;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:flex-start;width:100%;background:var(--surface)}
.opt .k{font-weight:700;color:var(--muted);min-width:1.2em}
.opt:not(:disabled):active{background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{color:var(--bad)}
.opt:disabled{cursor:default}
.verdict{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.verdict.ok{background:var(--ok-soft)} .verdict.bad{background:var(--bad-soft)}
.verdict b{color:var(--ok)} .verdict.bad b{color:var(--bad)}
.ghost{color:var(--muted);font-weight:500;padding:8px 0}

/* delete */
.danger{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.danger .ghost{color:var(--bad);text-align:left}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.del{background:var(--bad);color:var(--on-sem);border-radius:10px;padding:10px 16px;font-weight:600}
.del:disabled{opacity:.5}
.mode-sm{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:600}

/* result */
.score{font-family:var(--display);font-size:2.6rem;font-variant-numeric:tabular-nums;line-height:1}
.mist{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.mist .a{color:var(--ok);font-weight:600}
.note{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.qcard{animation:in .18s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}

/* theory */
.theory{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;line-height:1.55}
.theory h2{margin-top:6px}
.theory p{margin:0}
.theory ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.theory .ex{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;font-variant-numeric:tabular-nums;white-space:pre-line}
.theory .tip{background:var(--ok-soft);border-radius:8px;padding:10px 12px}
.theory b{font-weight:700}
.qtext{white-space:pre-line}
.primary.mode-theory{margin-bottom:2px}
</style>

<div class="wrap" id="app">
  <div class="eyebrow">Тренажёр</div>
  <h1>Билеты к сессии</h1>
  <p class="muted">Загружаю вопросы…</p>
</div>

<script>
const DECKS = [{"order": 3, "questions": [{"a": 0, "e": "Князь московский с 1359 г.", "id": "hist-donskoy-1", "o": ["1350–1389", "1300–1340", "1380–1425", "1440–1505"], "q": "Годы жизни Дмитрия Донского?"}, {"a": 0, "e": "Ему было 9 лет.", "id": "hist-donskoy-2", "o": ["1359", "1350", "1380", "1325"], "q": "С какого года Дмитрий — князь московский?"}, {"a": 0, "e": "Москва при нём стала главным центром Руси.", "id": "hist-donskoy-3", "o": ["Ивана Калиты", "Александра Невского", "Ивана III", "Михаила Тверского"], "q": "Чей внук Дмитрий Донской?"}, {"a": 0, "e": "Фактически правили митрополит и бояре.", "id": "hist-donskoy-4", "o": ["В 9 лет", "В 16 лет", "В 21 год", "В 3 года"], "q": "Во сколько лет Дмитрий стал князем?"}, {"a": 0, "e": "В 1362 г. Москва получила ярлык.", "id": "hist-donskoy-5", "o": ["Митрополит Алексий с московскими боярами", "Сергий Радонежский", "Хан Мамай", "Мать Дмитрия"], "q": "Кто фактически правил при малолетнем Дмитрии?"}, {"a": 0, "e": "Ярлык выдавала Орда.", "id": "hist-donskoy-6", "o": ["Ярлык на великое княжение Владимирское", "Независимость от Орды", "Каменный Кремль", "Титул царя"], "q": "Что Москва получила в 1362 г.?"}, {"a": 0, "e": "Первая каменная крепость на северо-востоке Руси.", "id": "hist-donskoy-7", "o": ["Белокаменный Кремль", "Храм Христа Спасителя", "Троице-Сергиев монастырь", "Деревянная стена Москвы"], "q": "Что построено в 1367 г.?"}, {"a": 0, "e": "Кремль выдержал, походы отбиты.", "id": "hist-donskoy-8", "o": ["Литовский князь Ольгерд", "Хан Тохтамыш", "Мамай", "Михаил Тверской"], "q": "Кто трижды ходил на Москву в 1368–1372 гг.?"}, {"a": 0, "e": "Михаил Александрович Тверской.", "id": "hist-donskoy-9", "o": ["Тверской князь признал себя «младшим братом» Дмитрия", "Тверь стала столицей", "Москву сожгли", "Князья поделили ярлык"], "q": "Чем закончился спор Москвы и Твери в 1375 г.?"}, {"a": 0, "e": "Власть в Орде захватил темник Мамай.", "id": "hist-donskoy-10", "o": ["Междоусобица в Орде", "Восстание в Москве", "Голод на Руси", "Война с Литвой"], "q": "Что такое «великая замятня»?"}, {"a": 0, "e": "Дмитрий перестал платить ему дань в прежнем размере.", "id": "hist-donskoy-11", "o": ["Темник Мамай", "Хан Батый", "Хан Узбек", "Мурза Бегич"], "q": "Кто захватил власть в Орде во время «великой замятни»?"}, {"a": 0, "e": "Первая крупная победа над ордынским войском.", "id": "hist-donskoy-12", "o": ["1378 г., с мурзой Бегичем", "1380 г., с Мамаем", "1382 г., с Тохтамышем", "1368 г., с Ольгердом"], "q": "Битва на реке Воже — когда и с кем?"}, {"a": 0, "e": "У впадения Непрядвы в Дон.", "id": "hist-donskoy-13", "o": ["8 сентября 1380 г.", "11 марта 1380 г.", "8 сентября 1480 г.", "4 ноября 1378 г."], "q": "Дата Куликовской битвы?"}, {"a": 0, "e": "Поле Куликово.", "id": "hist-donskoy-14", "o": ["У впадения Непрядвы в Дон", "На реке Воже", "На реке Угре", "У стен Москвы"], "q": "Где была Куликовская битва?"}, {"a": 0, "e": "Основатель Троицкого монастыря.", "id": "hist-donskoy-15", "o": ["Сергий Радонежский", "Митрополит Алексий", "Патриарх Никон", "Монах Нестор"], "q": "Кто благословил Дмитрия перед походом на Мамая?"}, {"a": 0, "e": "По преданию, оба погибли.", "id": "hist-donskoy-16", "o": ["С поединка Пересвета и Челубея", "С атаки засадного полка", "С переговоров", "С обстрела из пушек"], "q": "С чего началась Куликовская битва?"}, {"a": 0, "e": "Засадный полк вёл Владимир Серпуховской и Дмитрий Боброк-Волынский.", "id": "hist-donskoy-17", "o": ["Удар засадного полка", "Поединок Пересвета", "Помощь Литвы", "Бегство Мамая до боя"], "q": "Что решило исход Куликовской битвы?"}, {"a": 0, "e": "Удар засадного полка решил исход.", "id": "hist-donskoy-18", "o": ["Владимир Серпуховской и Дмитрий Боброк-Волынский", "Пересвет и Ослябя", "Олег Рязанский и Ягайло", "Сергий Радонежский"], "q": "Кто командовал засадным полком?"}, {"a": 0, "e": "Поэтому Мамай бился без них.", "id": "hist-donskoy-19", "o": ["Литовский князь Ягайло и Олег Рязанский", "Тохтамыш и Бегич", "Ольгерд и Михаил Тверской" d": "hist-pravda-31", "o": ["40 гривен", "80 гривен", "5 гривен", "100 гривен"], "q": "Штраф за убийство свободного человека (людина)?"}, {"a": 0, "e": "Как и за рядовича.", "id": "hist-pravda-32", "o": ["5 гривен", "40 гривен", "80 гривен", "20 гривен"], "q": "Штраф за убийство смерда?"}, {"a": 0, "e": "Тиуны и огнищане — княжьи мужи, 80 гривен.", "id": "hist-pravda-33", "o": ["Управляющий княжеским или боярским хозяйством", "Зависимый крестьянин", "Свидетель в суде", "Сборщик дани с Орды"], "q": "Кто такой тиун?"}, {"a": 0, "e": "Вира — 40 гривен.", "id": "hist-pravda-34", "o": ["Горожане, купцы, ремесленники, младшая дружина, свободные общинники", "Холопы и челядь", "Закупы и рядовичи", "Только бояре"], "q": "Кто относился к свободным людям («людинам»)?"}, {"a": 0, "e": "Степень их зависимости — спорный вопрос в науке.", "id": "hist-pravda-35", "o": ["Крестьяне, зависимые от князя", "Рабы", "Княжеские управляющие", "Купцы"], "q": "Кто такие смерды?"}, {"a": 0, "e": "5 гривен.", "id": "hist-pravda-36", "o": ["Заключивший «ряд» — договор о службе", "Взявший ссуду и отрабатывающий её", "Выпавший из своей среды", "Раб господина"], "q": "Кто такой рядович?"}, {"a": 0, "e": "Пространная правда защищает его от произвола господина.", "id": "hist-pravda-37", "o": ["Взявший «купу» (ссуду) и отрабатывающий её", "Заключивший договор о службе", "Раб господина", "Выпавший из своей среды"], "q": "Кто такой закуп?"}, {"a": 0, "e": "Побег закупа — путь в холопство.", "id": "hist-pravda-38", "o": ["Он становился холопом", "Его казнили", "Его прощали", "Он становился изгоем"], "q": "Что ждало закупа при побеге?"}, {"a": 0, "e": "Отпущенный холоп, неграмотный сын попа, разорившийся купец.", "id": "hist-pravda-39", "o": ["Выпавшие из своей среды", "Княжеские дружинники", "Зависимые от князя крестьяне", "Иностранные купцы"], "q": "Кто такие изгои?"}, {"a": 0, "e": "Изгои защищены как свободные.", "id": "hist-pravda-40", "o": ["Неграмотный сын попа", "Тиун", "Смерд", "Огнищанин"], "q": "Кто из них изгой?"}, {"a": 0, "e": "За убийство платили хозяину как за порчу имущества, 5–6 гривен.", "id": "hist-pravda-41", "o": ["Бесправные рабы, имущество господина", "Свободные общинники", "Младшая дружина", "Зависимые от князя крестьяне"], "q": "Кто такие холопы?"}, {"a": 0, "e": "Разорившийся купец — изгой.", "id": "hist-pravda-42", "o": ["Разорение купца", "Побег закупа", "Брак с холопкой без договора", "Служба тиуном без договора"], "q": "Что НЕ делало человека холопом по Пространной правде?"}, {"a": 0, "e": "Пять путей в холопство из Пространной правды.", "id": "hist-pravda-43", "o": ["Плен, самопродажа, брак с холопкой, служба тиуном без договора, побег закупа", "Только родиться в семье холопа", "Неуплата налога", "Переезд в другой город"], "q": "Как можно было стать холопом?"}], "subject": "История России", "title": "Русская правда", "id": "hist-pravda"}, {"order": 1, "questions": [{"a": 0, "e": "Либо славяне пришли извне, либо жили на этих землях изначально (автохтоны).", "id": "hist-slavs-1", "o": ["Пришлые и автохтонные (коренное население)", "Норманнская и славянская", "Скифская и сарматская", "Византийская и хазарская"], "q": "Какие две версии происхождения восточных славян называются в лекции?"}, {"a": 0, "e": "В конспекте записано «Склонены»: правильно склавины.", "id": "hist-slavs-2", "o": ["Анты, склавины, венеды", "Поляне, древляне, северяне", "Варяги, норманны, русы", "Скифы, сарматы, гунны"], "q": "Как в VI в. называли славян византийские и готские авторы?"}, {"a": 0, "e": "К VIII в. на Восточно-Европейской равнине было около 15 племенных союзов.", "id": "hist-slavs-3", "o": ["Около 15", "Около 5", "Около 30", "Около 50"], "q": "Сколько племенных союзов восточных славян насчитывалось к VIII в. по «Повести временных лет»?"}, {"a": 0, "e": "Поляне жили в Среднем Поднепровье, центр — Киев.", "id": "hist-slavs-4", "o": ["Киев", "Чернигов", "Смоленск", "Туров"], "q": "Племенной центр полян?"}, {"a": 0, "e": "Северяне — центр Чернигов.", "id": "hist-slavs-5", "o": ["Чернигов", "Киев", "Полоцк", "Смоленск"], "q": "Племенной центр северян?"}, {"a": 0, "e": "Кривичи — центр Смоленск.", "id": "hist-slavs-6", "o": ["Смоленск", "Чернигов", "Туров", "Киев"], "q": "Племенной центр кривичей?"}, {"a": 0, "e": "Дреговичи (в конспекте «дряговичи») — центр Туров.", "id": "hist-slavs-7", "o": ["Туров", "Искоростень", "Смоленск", "Полоцк"], "q": "Племенной центр дреговичей?"}, {"a": 0, "e": "В конспекте записано «скоростень»: правильно Искоростень.", "id": "hist-slavs-8", "o": ["Искоростень", "Туров", "Новгород", "Чернигов"], "q": "Центр древлян, живших у реки Припять рядом с полянами?"}, {"a": 0, "e": "Полочане — от реки Полоты, центр Полоцк.", "id": "hist-slavs-9", "o": ["От реки Полоты", "От слова «поле»", "От имени князя Полота", "От озера Полонь"], "q": "Откуда название полочан?"}, {"a": 0, "e": "Новгородские (ильменские) словене.", "id": "hist-slavs-10", "o": ["Ильмень", "Ладожское", "Онежское", "Чудское"], "q": "Вокруг какого озера жили ильменские словене (центр — Новгород)?"}, {"a": 0, "e": "В конспекте «радевичи»: правильно радимичи.", "id": "hist-slavs-11", "o": ["Радимичи", "Вятичи", "Древляне", "Поляне"], "q": "На реке Сож жили..."}, {"a": 0, "e": "Земледелие было главным, охота, рыболовство и бортничество — дополнительными.", "id": "hist-slavs-12", "o": ["Земледелие", "Охота", "Торговля", "Кочевое скотоводство"], "q": "Основное занятие восточных славян?"}, {"a": 0, "e": "Лес вырубали, корни выжигали, землю использовали до истощения.", "id": "hist-slavs-13", "o": ["В лесной зоне", "В степной зоне", "В лесостепи", "В горах"], "q": "Где было распространено подсечно-огневое земледелие?"}, {"a": 0, "e": "Ранняя форма земледелия в лесной зоне.", "id": "hist-slavs-14", "o": ["Лес вырубают и выжигают, землю используют до полного истощения", "Участок оставляют отдыхать на год", "Поле делят на три части по очереди", "Землю удобряют навозом и пашут плугом"], "q": "В чём суть подсечно-огневого земледелия?"}, {"a": 0, "e": "Участок используют, пока он плодороден, затем «перекладываются» на новый.", "id": "hist-slavs-15", "o": ["В степных и лесостепных зонах", "В лесных зонах", "В тундре", "Только вокруг городов"], "q": "Где было распространено переложное земледелие?"}, {"a": 0, "e": "Один из промыслов наряду с охотой и рыболовством.", "id": "hist-slavs-16", "o": ["Сбор мёда диких пчёл", "Ловля рыбы сетями", "Выделка кож", "Обработка металла"], "q": "Что такое бортничество?"}, {"a": 0, "e": "Четыре ремесла из лекции.", "id": "hist-slavs-17", "o": ["Кузнечное, гончарное, ткацкое, кожевенное", "Стекольное, ювелирное, книжное", "Оружейное, пороховое, часовое", "Только гончарное"], "q": "Какие ремёсла были распространены у восточных славян?"}, {"a": 0, "e": "Переход к соседской общине привёл к частной собственности и неравенству.", "id": "hist-slavs-18", "o": ["Соседская", "Племенная", "Княжеская", "Монастырская"], "q": "Какая община пришла на смену родовой?"}, {"a": 0, "e": "Излишки оседали у авторитетных людей племени, из них потом выделились вожди.", "id": "hist-slavs-19", "o": ["Из авторитетных лиц, у которых оседали излишки", "Из пленных варягов", "Из византийских купцов", "Из жрецов-волхвов"], "q": "Из кого формировалась родовая знать?"}, {"a": 0, "e": "Важнейшие вопросы решались на вече.", "id": "hist-slavs-20", "o": ["Вече", "Дума", "Сейм", "Тинг"], "q": "Как называлось народное собрание у восточных славян?"}, {"a": 0, "e": "Дружина завоёвывала территории и собирала дань.", "id": "hist-slavs-21", "o": ["Дружина", "Ополчение", "Стрельцы", "Опричнина"], "q": "Военная организация при князе — это..."}, {"a": 0, "e": "Этот путь ускорил развитие городов и ремёсел.", "id": "hist-slavs-22", "o": ["«Из варяг в греки»", "Великий шёлковый путь", "Янтарный путь", "Путь «из Индии в Китай»"], "q": "Какой торговый путь проходил через земли восточных славян?"}, {"a": 0, "e": "Князья хотели сделать главой Перуна.", "id": "hist-slavs-23", "o": ["Сварог — бог-кузнец", "Велес", "Стрибог", "Мокошь"] ": ["Сохранение населения, укрепление здоровья, поддержка семьи", "Цифровая трансформация", "Технологическое лидерство", "Экологическое благополучие"], "q": "Какая национальная цель первая?"}, {"a": 0, "e": "Наоборот: устойчивая и динамичная экономика.", "id": "org-5-12", "o": ["Сырьевая специализация экономики", "Комфортная и безопасная среда для жизни", "Экологическое благополучие", "Реализация потенциала каждого человека"], "q": "Что НЕ входит в национальные цели?"}, {"a": 0, "e": "Итог курса.", "id": "org-5-13", "o": ["Солидарность, единство, стабильность, компромисс, взаимопомощь, ответственность", "Конкуренция, индивидуализм, рост", "Изоляция, мобилизация, контроль", "Глобализация, открытые границы"], "q": "Какими словами курс описывает образ будущего?"}, {"a": 0, "e": "Раздел 5.", "id": "org-5-14", "o": ["Россия отстаивает суверенитет и многополярный мир, будущее строится на солидарности и ответственности граждан", "Россия должна войти в Евросоюз", "Будущее определяют только природные ресурсы", "Государство должно уйти из экономики"], "q": "Итоговая мысль курса?"}], "subject": "Основы российской государственности", "title": "5. Вызовы будущего", "id": "org-5"}, {"id": "math-0", "subject": "Математика", "title": "0. Проверка уровня (5–9 класс)", "order": 10, "theory": "## Зачем этот тест\nОн покажет, что ты уже помнишь, а что забылось. По результату я начну курс именно с твоих пробелов, а не со всего подряд.\n\n## Как проходить\n• Решай **без калькулятора**, на листке можно.\n• Не знаешь ответ — не гадай долго: выбери любой вариант и прочитай пояснение.\n• Вопросы идут от простых (5 класс) к сложным (8–9 класс), так что ошибки в конце — это нормально.\n\n## Что сделать после\nНа экране результата будут твои ошибки. В пояснении к каждой написана **тема**. Напиши мне, сколько ошибок и в каких темах (или пришли скриншот) — и я подготовлю следующие уроки.\n\n! Тест можно пройти ещё раз через пару недель занятий — будет видно прогресс.", "questions": [{"id": "math-0-1", "q": "7 · 8 = ?", "o": ["56", "54", "64", "48"], "a": 0, "e": "Тема: таблица умножения."}, {"id": "math-0-2", "q": "144 : 12 = ?", "o": ["12", "14", "11", "13"], "a": 0, "e": "Тема: деление. 12 · 12 = 144."}, {"id": "math-0-3", "q": "2 + 3 · 4 = ?", "o": ["14", "20", "24", "9"], "a": 0, "e": "Тема: порядок действий. Сначала умножение: 3 · 4 = 12, потом 2 + 12 = 14."}, {"id": "math-0-4", "q": "(2 + 3) · 4 = ?", "o": ["20", "14", "24", "9"], "a": 0, "e": "Тема: порядок действий. Сначала скобки: 5 · 4 = 20."}, {"id": "math-0-5", "q": "20 − 8 : 2 = ?", "o": ["16", "6", "14", "12"], "a": 0, "e": "Тема: порядок действий. Деление раньше вычитания: 8 : 2 = 4, 20 − 4 = 16."}, {"id": "math-0-6", "q": "Что больше: 1/2 или 1/3?", "o": ["1/2", "1/3", "Они равны", "Сравнить нельзя"], "a": 0, "e": "Тема: дроби. Половина пиццы больше трети: чем на меньшее число частей делим, тем больше кусок."}, {"id": "math-0-7", "q": "Сократи дробь 6/8", "o": ["3/4", "2/3", "1/2", "3/8"], "a": 0, "e": "Тема: дроби. Делим верх и низ на 2: 6/8 = 3/4."}, {"id": "math-0-8", "q": "1/4 + 2/4 = ?", "o": ["3/4", "3/8", "2/4", "1/2"], "a": 0, "e": "Тема: сложение дробей. Знаменатели одинаковые — складываем только числители: 3/4."}, {"id": "math-0-9", "q": "1/2 + 1/3 = ?", "o": ["5/6", "2/5", "2/6", "1/5"], "a": 0, "e": "Тема: сложение дробей с разными знаменателями. 1/2 = 3/6, 1/3 = 2/6, вместе 5/6."}, {"id": "math-0-10", "q": "2/3 · 3/4 = ?", "o": ["1/2", "6/7", "8/9", "5/12"], "a": 0, "e": "Тема: умножение дробей. Верх на верх, низ на низ: 6/12 = 1/2."}, {"id": "math-0-11", "q": "0,5 + 0,25 = ?", "o": ["0,75", "0,30", "0,525", "7,5"], "a": 0, "e": "Тема: десятичные дроби. Складываем разряд под разрядом: 0,50 + 0,25 = 0,75."}, {"id": "math-0-12", "q": "0,3 · 0,2 = ?", "o": ["0,06", "0,6", "6", "0,006"], "a": 0, "e": "Тема: десятичные дроби. 3 · 2 = 6, после запятой всего два знака — 0,06."}, {"id": "math-0-13", "q": "Запиши 1/4 десятичной дробью", "o": ["0,25", "0,4", "1,4", "0,14"], "a": 0, "e": "Тема: десятичные дроби. 1/4 = 1 : 4 = 0,25."}, {"id": "math-0-14", "q": "Сколько будет 10% от 250?", "o": ["25", "2,5", "10", "240"], "a": 0, "e": "Тема: проценты. 10% — это десятая часть: 250 : 10 = 25."}, {"id": "math-0-15", "q": "−5 + 3 = ?", "o": ["−2", "2", "−8", "8"], "a": 0, "e": "Тема: отрицательные числа. Был долг 5, отдал 3 — долг 2: −2."}, {"id": "math-0-16", "q": "−4 · (−3) = ?", "o": ["12", "−12", "−7", "7"], "a": 0, "e": "Тема: отрицательные числа. Минус на минус даёт плюс: 12."}, {"id": "math-0-17", "q": "3 − 7 = ?", "o": ["−4", "4", "−10", "10"], "a": 0, "e": "Тема: отрицательные числа. Из меньшего вычитаем большее — получается отрицательное: −4."}, {"id": "math-0-18", "q": "2³ = ?", "o": ["8", "6", "9", "5"], "a": 0, "e": "Тема: степени. 2³ = 2 · 2 · 2 = 8 (не 2 · 3!)."}, {"id": "math-0-19", "q": "10⁻² = ?", "o": ["0,01", "−100", "−20", "0,1"], "a": 0, "e": "Тема: степени (нужно в физике). Минус в степени — это деление: 10⁻² = 1/100 = 0,01."}, {"id": "math-0-20", "q": "x + 5 = 12. Чему равен x?", "o": ["7", "17", "60", "2,4"], "a": 0, "e": "Тема: уравнения. x = 12 − 5 = 7."}, {"id": "math-0-21", "q": "3x = 18. Чему равен x?", "o": ["6", "15", "21", "54"], "a": 0, "e": "Тема: уравнения. x = 18 : 3 = 6."}, {"id": "math-0-22", "q": "2x − 4 = 10. Чему равен x?", "o": ["7", "3", "5", "12"], "a": 0, "e": "Тема: уравнения. 2x = 10 + 4 = 14, x = 7."}, {"id": "math-0-23", "q": "Упрости: 3a + 2a", "o": ["5a", "6a", "5a²", "5"], "a": 0, "e": "Тема: выражения с буквами. 3 яблока + 2 яблока = 5 яблок: 5a."}, {"id": "math-0-24", "q": "Раскрой скобки: 2(x + 3)", "o": ["2x + 6", "2x + 3", "x + 6", "2x + 5"], "a": 0, "e": "Тема: раскрытие скобок. Множитель умножается на каждое слагаемое: 2·x + 2·3."}, {"id": "math-0-25", "q": "Формула скорости v = s/t. Вырази s.", "o": ["s = v · t", "s = v / t", "s = t / v", "s = v + t"], "a": 0, "e": "Тема: выражение величины из формулы (главное для физики). Умножаем обе части на t."}, {"id": "math-0-26", "q": "Формула v = s/t. Вырази t.", "o": ["t = s / v", "t = s · v", "t = v / s", "t = s − v"], "a": 0, "e": "Тема: выражение величины из формулы. Из s = v · t делим на v: t = s / v."}, {"id": "math-0-27", "q": "x/4 = 3/2. Чему равен x?", "o": ["6", "2", "1,5", "12"], "a": 0, "e": "Тема: пропорции. x = 4 · 3/2 = 6."}, {"id": "math-0-28", "q": "√49 = ?", "o": ["7", "14", "24,5", "9"], "a": 0, "e": "Тема: квадратный корень. 7 · 7 = 49."}, {"id": "math-0-29", "q": "5² + 2 = ?", "o": ["27", "12", "49", "17"], "a": 0, "e": "Тема: степени и порядок действий. Степень раньше сложения: 25 + 2 = 27."}, {"id": "math-0-30", "q": "3 · 10³ = ?", "o": ["3000", "30", "1000", "300"], "a": 0, "e": "Тема: степени десяти (нужно в физике). 10³ = 1000, 3 · 1000 = 3000."}]}, {"id": "math-1", "subject": "Математика", "title": "5.4 Порядок действий", "order": 14, "theory": "## Зачем это нужно\nЛюбая формула в физике — это цепочка действий. Если посчитать их не в том порядке, ответ будет неверным, даже если каждое действие сделано правильно.\n\n## Правило — три шага\n• Сначала — то, что в **скобках**.\n• Потом — **умножение и деление**.\n• В конце — **сложение и вычитание**.\n\n> 2 + 3 · 4\n> Сначала умножение: 3 · 4 = 12\n> Потом сложение: 2 + 12 = **14**\n> (а не 5 · 4 = 20!)\n\n> (2 + 3) · 4\n> Скобки первыми: 2 + 3 = 5\n> Потом: 5 · 4 = **20**\n\n## «Слева направо» — что это значит\nУмножение и деление **равноправны**: никто не главнее. Делай их в том порядке, в каком они стоят, читая слева направо. Со сложением и вычитанием так же.\n\n> 24 : 4 · 2\n> Слева направо: 24 : 4 = 6, потом 6 · 2 = **12**\n> (неверно: 4 · 2 = 8 и 24 : 8 = 3)\n\n> 10 − 4 + 3\n> Слева направо: 10 − 4 = 6, потом 6 + 3 = **9**\n> (неверно: 4 + 3 = 7 и 10 − 7 = 3)\n\n## Скобки внутри скобок\nНачинай с самых внутренних и двигайся наружу.\n\n> 2 · (3 + (8 − 6))\n> Внутренние: 8 − 6 = 2\n> Потом: 3 + 2 = 5\n> Итог: 2 · 5 = **10**\n\n## Степень (квадрат, куб)\nСтепень — это повторное умножение: 3² = 3 · 3 = 9. Её считают **после скобок, но раньше умножения**. Подробно о степенях будет отдельная тема.\n\n> 2 · 3² = 2 · 9 = **18** (а не 6² = 36)\n\n! Совет: прежде чем считать, поставь над каждым знаком цифру 1, 2, 3… — в каком порядке будешь делать действия. С этой привычкой ошибок почти не бывает.", "questions": [{"id": "math-1-1", "q": "Что делают первым в примере 5 + 6 · 2?", "o": ["Умножение", "Сложение", "То, что стоит левее", "Без разницы"], "a": 0, "e": "Умножение и деление всегда раньше сложения и вычитания (если нет скобок)."}, {"id": "math-1-2", "q": "Что делают первым в примере 18 − 6 : 3?", "o": ["Деление", "Вычитание", "То, что стоит левее", "Без разницы"], "a": 0, "e": "Деление раньше вычитания."}, {"id": "math-1-3", "q": "Что делают первым в примере (7 − 2) · 3?", "o": ["Вычитание в скобках", "Умножение", "Умножение 2 · 3", "Без разницы"], "a": 0, "e": "Скобки — всегда первыми."}, {"id": "math-1-4", "q": "Что делают первым в примере 20 : 5 · 2?", "o": ["Деление — оно стоит левее", "Умножение — оно главнее", "Без разницы, ответ одинаковый", "Сначала 5 · 2"], "a": 0, "e": "Умножение и деление равноправны — идём слева направо. 20 : 5 = 4, 4 · 2 = 8."}, {"id": "math-1-5", "q": "Что главнее: умножение или деление?", "o": ["Они равны — делаем слева направо", "Умножение", "Деление", "То, где числа больше"], "a": 0, "e": "Это одно действие «одного уровня», порядок решает только позиция слева направо."}, {"id": "math-1-6", "q": "2 + 3 · 4 = ?", "o": ["14", "20", "24", "9"], "a": 0, "e": "3 · 4 = 12, потом 2 + 12 = 14."}, {"id": "math-1-7", "q": "(2 + 3) · 4 = ?", "o": ["20", "14", "24", "9"], "a": 0, "e": "Скобки: 5, потом 5 · 4 = 20."}, {"id": "math-1-8", "q": "5 + 6 · 2 = ?", "o": ["17", "22", "13", "30"], "a": 0, "e": "6 · 2 = 12, 5 + 12 = 17."}, {"id": "math-1-9", "q": "18 − 6 : 3 = ?", "o": ["16", "4", "5", "12"], "a": 0, "e": "6 : 3 = 2, 18 − 2 = 16."}, {"id": "math-1-10", "q": "(18 − 6) : 3 = ?", "o": ["4", "16", "5", "12"], "a": 0, "e": "Скобки: 12, потом 12 : 3 = 4."}, {"id": "math-1-11", "q": "24 : 4 · 2 = ?", "o": ["12", "3", "8", "48"], "a": 0, "e": "Слева направо: 24 : 4 = 6, 6 · 2 = 12."}, {"id": "math-1-12", "q": "15 − 5 + 2 = ?", "o": ["12", "8", "22", "18"], "a": 0, "e": "Слева направо: 15 − 5 = 10, 10 + 2 = 12."}, {"id": "math-1-13", "q": "10 − 4 + 3 = ?", "o": ["9", "3", "13", "1"], "a": 0, "e": "Слева направо: 10 − 4 = 6, 6 + 3 = 9."}, {"id": "math-1-14", "q": "100 − 20 · 3 = ?", "o": ["40", "240", "60", "77"], "a": 0, "e": "20 · 3 = 60, 100 − 60 = 40."}, {"id": "math-1-15", "q": "(100 − 20) · 3 = ?", "o": ["240", "40", "60", "77"], "a": 0, "e": "Скобки: 80, потом 80 · 3 = 240."}, {"id": "math-1-16", "q": "8 + 12 : 4 − 1 = ?", "o": ["10", "4", "12", "7"], "a": 0, "e": "12 : 4 = 3, потом слева направо: 8 + 3 = 11, 11 − 1 = 10."}, {"id": "math-1-17", "q": "3 · (4 + 5) − 7 = ?", "o": ["20", "10", "6", "27"], "a": 0, "e": "Скобки: 9, потом 3 · 9 = 27, 27 − 7 = 20."}, {"id": "math-1-18", "q": "2 · (3 + (8 − 6)) = ?", "o": ["10", "8", "14", "12"], "a": 0, "e": "Внутренние скобки: 2, потом 3 + 2 = 5, 2 · 5 = 10."}, {"id": "math-1-19", "q": "50 : (2 + 3) · 2 = ?", "o": ["20", "5", "10", "25"], "a": 0, "e": "Скобки: 5. Потом слева направо: 50 : 5 = 10, 10 · 2 = 20."}, {"id": "math-1-20", "q": "7 + 3 · (6 − 4) = ?", "o": ["13", "20", "15", "10"], "a": 0, "e": "Скобки: 2, потом 3 · 2 = 6, 7 + 6 = 13."}, {"id": "math-1-21", "q": "12 : (6 − 2) + 5 = ?", "o": ["8", "5", "3", "12"], "a": 0, "e": "Скобки: 4, потом 12 : 4 = 3, 3 + 5 = 8."}, {"id": "math-1-22", "q": "6 + 4 · 5 − 10 = ?", "o": ["16", "40", "6", "26"], "a": 0, "e": "4 · 5 = 20, потом 6 + 20 = 26, 26 − 10 = 16."}, {"id": "math-1-23", "q": "40 − 3 · (2 + 4) : 2 = ?", "o": ["31", "111", "37", "22"], "a": 0, "e": "Скобки: 6. Потом 3 · 6 = 18, 18 : 2 = 9. В конце 40 − 9 = 31."}, {"id": "math-1-24", "q": "2 · 3² = ?", "o": ["18", "36", "12", "9"], "a": 0, "e": "Степень раньше умножения: 3² = 9, 2 · 9 = 18."}, {"id": "math-1-25", "q": "(2 · 3)² = ?", "o": ["36", "18", "12", "72"], "a": 0, "e": "Скобки: 6, потом 6² = 36."}, {"id": "math-1-26", "q": "Где поставить скобки, чтобы 2 + 3 · 4 стало равно 20?", "o": ["(2 + 3) · 4", "2 + (3 · 4)", "(2 + 3 · 4)", "Никак нельзя"], "a": 0, "e": "Скобки заставят сначала сложить: 5 · 4 = 20."}, {"id": "math-1-27", "q": "Купили 3 тетради по 15 ₽ и ручку за 20 ₽. Какое выражение даёт сумму покупки?", "o": ["3 · 15 + 20", "(3 + 15) · 20", "3 · (15 + 20)", "3 + 15 · 20"], "a": 0, "e": "3 · 15 = 45 ₽ за тетради, плюс 20 ₽ — всего 65 ₽."}, {"id": "math-1-28", "q": "Формула s = v · t + 5. Если v = 2, t = 3, чему равно s?", "o": ["11", "16", "30", "10"], "a": 0, "e": "Подставляем: 2 · 3 + 5. Сначала умножение: 6, потом 6 + 5 = 11."}]}, {"id": "math-2", "subject": "Математика", "title": "5.6 Обыкновенные дроби: что это такое", "order": 16, "theory": "## Что такое дробь\nДробь — это часть от целого. Запись a/b значит: целое разрезали на **b** равных частей и взяли **a** из них.\n\n> 3/4 — пиццу разрезали на 4 куска, взяли 3.\n\n• Нижнее число — **знаменатель**: на сколько частей делим.\n• Верхнее число — **числитель**: сколько частей взяли.\n\n! Как запомнить: числитель «считает» взятые куски, а знаменатель «называет», какого они размера (четверти, пятые…).\n\n## Дробь — это деление\nЧерта дроби значит то же, что знак деления.\n\n> 3/4 = 3 : 4 = 0,75\n> 12/4 = 12 : 4 = 3\n\nПоэтому формулу из физики v = s/t читают как «s разделить на t».\n\n## Правильные и неправильные дроби\n• **Правильная** — числитель меньше знаменателя (2/5, 3/4). Она меньше единицы.\n• **Неправильная** — числитель больше знаменателя или равен ему (7/4, 5/5). Она больше единицы или равна ей.\n• Если верх равен низу — дробь равна 1: 5/5 = 1.\n\n## Смешанные числа\nНеправильную дробь можно записать как целую часть и остаток.\n\n> 7/4: делим 7 на 4 — получается 1 и остаток 3\n> 7/4 = 1 целая 3/4\n\nИ обратно: целую часть умножаем на знаменатель и прибавляем числитель.\n\n> 2 целых 1/3 = (2 · 3 + 1)/3 = 7/3\n\n## Сокращение — главное свойство дроби\nВерх и низ можно **умножить или разделить на одно и то же число** — дробь не изменится.\n\n> 6/8 — делим верх и низ на 2 → 3/4\n> 10/15 — делим на 5 → 2/3\n> 1/2 = 2/4 = 3/6 = 5/10 — это всё одна и та же половина\n\nСокращают, пока у верха и низа есть общий делитель. А вот **прибавлять** одно и то же число к верху и низу нельзя — дробь изменится.\n\n## Сравнение дробей\n• Знаменатели одинаковые — больше та, где больше числитель: 3/7 больше, чем 2/7.\n• Числители одинаковые — больше та, где **меньше** знаменатель: 1/3 больше, чем 1/5 (если пиццу делить на 3 части, куски крупнее, чем при делении на 5).\n• Если всё разное — сначала приводят к общему знаменателю (это в следующей теме).", "questions": [{"id": "math-2-1", "q": "В дроби 3/7 знаменатель — это…", "o": ["7", "3", "10", "4"], "a": 0, "e": "Знаменатель — нижнее число."}, {"id": "math-2-2", "q": "В дроби 3/7 числитель — это…", "o": ["3", "7", "10", "21"], "a": 0, "e": "Числитель — верхнее число."}, {"id": "math-2-3", "q": "Что показывает знаменатель?", "o": ["На сколько равных частей делят целое", "Сколько частей взяли", "Сколько частей осталось", "Целую часть числа"], "a": 0, "e": "Знаменатель — нижнее число, это «размер» долей."}, {"id": "math-2-4", "q": "Что показывает числитель?", "o": ["Сколько частей взяли", "На сколько частей делят целое", "Сколько частей осталось", "Размер одной части"], "a": 0, "e": "Числитель — верхнее число, он считает взятые части."}, {"id": "math-2-5", "q": "Пиццу разрезали на 8 кусков, съели 3. Какая часть пиццы съедена?", "o": ["3/8", "8/3", "5/8", "3/5"], "a": 0, "e": "Всего 8 частей (знаменатель), взяли 3 (числитель)."}, {"id": "math-2-6", "q": "Пиццу разрезали на 8 кусков, съели 3. Какая часть осталась?", "o": ["5/8", "3/8", "8/5", "5/3"], "a": 0, "e": "Осталось 8 − 3 = 5 кусков из 8."}, {"id": "math-2-7", "q": "Что означает черта дроби?", "o": ["Деление", "Вычитание", "Умножение", "Сравнение"], "a": 0, "e": "a/b — это a : b."}, {"id": "math-2-8", "q": "Чему равно 3/4 в виде десятичной дроби?", "o": ["0,75", "0,34", "1,33", "0,7"], "a": 0, "e": "3 : 4 = 0,75."}, {"id": "math-2-9", "q": "12/4 = ?", "o": ["3", "8", "48", "16"], "a": 0, "e": "Черта — деление: 12 : 4 = 3."}, {"id": "math-2-10", "q": "Какая дробь правильная?", "o": ["4/9", "9/4", "7/7", "11/3"], "a": 0, "e": "Правильная — числитель меньше знаменателя."}, {"id": "math-2-11", "q": "Какая дробь неправильная?", "o": ["8/5", "1/2", "3/10", "5/8"], "a": 0, "e": "Неправильная — числитель больше знаменателя (или равен)."}, {"id": "math-2-12", "q": "9/9 = ?", "o": ["1", "0", "9", "81"], "a": 0, "e": "Взяли все 9 частей из 9 — это целое."}, {"id": "math-2-13", "q": "Запиши 7/4 смешанным числом", "o": ["1 целая 3/4", "1 целая 4/7", "3 целых 1/4", "7 целых 1/4"], "a": 0, "e": "7 : 4 = 1 (остаток 3), значит 1 целая 3/4."}, {"id": "math-2-14", "q": "Запиши 11/3 смешанным числом", "o": ["3 целых 2/3", "3 целых 1/3", "2 целых 5/3", "1 целая 2/3"], "a": 0, "e": "11 : 3 = 3 (остаток 2), значит 3 целых 2/3."}, {"id": "math-2-15", "q": "2 целых 1/3 — какая это неправильная дробь?", "o": ["7/3", "5/3", "3/7", "6/3"], "a": 0, "e": "2 · 3 + 1 = 7, знаменатель тот же: 7/3."}, {"id": "math-2-16", "q": "3 целых 1/2 — какая это неправильная дробь?", "o": ["7/2", "4/2", "5/2", "3/2"], "a": 0, "e": "3 · 2 + 1 = 7: 7/2."}, {"id": "math-2-17", "q": "Сократи дробь 6/8", "o": ["3/4", "2/4", "3/8", "1/4"], "a": 0, "e": "Делим верх и низ на 2."}, {"id": "math-2-18", "q": "Сократи дробь 10/15", "o": ["2/3", "1/3", "5/3", "2/5"], "a": 0, "e": "Делим верх и низ на 5."}, {"id": "math-2-19", "q": "Сократи дробь 12/16", "o": ["3/4", "2/3", "4/3", "1/4"], "a": 0, "e": "Делим верх и низ на 4."}, {"id": "math-2-20", "q": "Сократи дробь 9/27", "o": ["1/3", "1/9", "3/2", "1/4"], "a": 0, "e": "Делим верх и низ на 9."}, {"id": "math-2-21", "q": "Какая дробь равна 1/2?", "o": ["4/8", "2/3", "3/4", "1/4"], "a": 0, "e": "4/8 — делим на 4, получаем 1/2."}, {"id": "math-2-22", "q": "Какая дробь НЕ равна 2/3?", "o": ["3/4", "4/6", "6/9", "10/15"], "a": 0, "e": "4/6, 6/9 и 10/15 сокращаются до 2/3, а 3/4 — нет."}, {"id": "math-2-23", "q": "Что больше: 3/7 или 5/7?", "o": ["5/7", "3/7", "Они равны", "Сравнить нельзя"], "a": 0, "e": "Знаменатели одинаковые — больше та, где больше числитель."}, {"id": "math-2-24", "q": "Что больше: 1/3 или 1/5?", "o": ["1/3", "1/5", "Они равны", "Сравнить нельзя"], "a": 0, "e": "Числители одинаковые — больше та, где меньше знаменатель: треть больше пятой части."}, {"id": "math-2-25", "q": "Расставь по возрастанию: 1/2, 1/4, 1/8", "o": ["1/8, 1/4, 1/2", "1/2, 1/4, 1/8", "1/4, 1/8, 1/2", "1/2, 1/8, 1/4"], "a": 0, "e": "Чем больше знаменатель при одинаковом числителе, тем меньше дробь."}, {"id": "math-2-26", "q": "Можно ли умножить числитель и знаменатель на 3?", "o": ["Да, дробь не изменится", "Да, дробь станет в 3 раза больше", "Нет, так делать нельзя", "Только если дробь неправильная"], "a": 0, "e": "Это основное свойство дроби: 1/2 = 3/6."}, {"id": "math-2-27", "q": "Можно ли прибавить по 1 к числителю и знаменателю?", "o": ["Нет, дробь изменится", "Да, дробь не изменится", "Да, если числа маленькие", "Только для правильных дробей"], "a": 0, "e": "Например, 1/2 станет 2/3 — это уже другая дробь. Умножать и делить можно, прибавлять — нет."}, {"id": "math-2-28", "q": "В формуле v = s/t что делают с s и t?", "o": ["s делят на t", "s умножают на t", "Из s вычитают t", "t делят на s"], "a": 0, "e": "Черта дроби — деление: скорость = путь : время."}]}, {"id": "math-3", "subject": "Математика", "title": "5.7 Сложение и вычитание дробей", "order": 17, "theory": "## Одинаковые знаменатели — просто\nЕсли знаменатели одинаковые, складываем (или вычитаем) **только числители**, а знаменатель оставляем.\n\n> 1/5 + 2/5 = 3/5\n> 7/9 − 4/9 = 3/9 = 1/3 (не забудь сократить)\n\n! Главная ошибка — складывать знаменатели. 1/5 + 2/5 — это НЕ 3/10. Куски были пятыми долями и остались пятыми, просто их стало три.\n\n## Разные знаменатели — сначала уравнять\nСложить 1/2 и 1/3 сразу нельзя: куски разного размера. Сначала обе дроби режут на одинаковые кусочки — приводят к **общему знаменателю**.\n\n## Как найти общий знаменатель\nНужно число, которое делится на оба знаменателя.\n• Если больший знаменатель делится на меньший — он и будет общим. Для 4 и 8 → 8.\n• Иначе перебирай числа, кратные большему: для 4 и 6 пробуем 6 (на 4 не делится), 12 — делится. Общий — 12.\n• В крайнем случае просто перемножь знаменатели: для 2 и 3 → 6.\n\n## Дополнительный множитель\nУзнай, во сколько раз общий знаменатель больше старого, и умножь на это число **и верх, и низ** дроби.\n\n> 1/2 + 1/3, общий знаменатель 6\n> 1/2 = (1 · 3)/(2 · 3) = 3/6\n> 1/3 = (1 · 2)/(3 · 2) = 2/6\n> 3/6 + 2/6 = **5/6**\n\n> 3/4 − 1/6, общий знаменатель 12\n> 3/4 = 9/12, 1/6 = 2/12\n> 9/12 − 2/12 = **7/12**\n\n## Целое число и дробь\nЦелое можно записать дробью с любым знаменателем: 1 = 8/8, 2 = 6/3.\n\n> 1 − 3/8 = 8/8 − 3/8 = **5/8**\n> 2 + 1/3 = 6/3 + 1/3 = **7/3** (это 2 целых 1/3)\n\n## Алгоритм целиком\n• Найти общий знаменатель.\n• Домножить каждую дробь (верх и низ).\n• Сложить или вычесть числители.\n• Сократить ответ, если можно.", "questions": [{"id": "math-3-1", "q": "1/5 + 2/5 = ?", "o": ["3/5", "3/10", "2/5", "1/5"], "a": 0, "e": "Знаменатели одинаковые — складываем только числители."}, {"id": "math-3-2", "q": "3/7 + 2/7 = ?", "o": ["5/7", "5/14", "6/7", "1/7"], "a": 0, "e": "3 + 2 = 5, знаменатель остаётся 7."}, {"id": "math-3-3", "q": "7/9 − 4/9 = ?", "o": ["1/3", "11/9", "2/3", "1/9"], "a": 0, "e": "7 − 4 = 3, получаем 3/9 = 1/3 после сокращения."}, {"id": "math-3-4", "q": "5/8 − 1/8 = ?", "o": ["1/2", "4/16", "6/8", "1/4"], "a": 0, "e": "4/8 = 1/2."}, {"id": "math-3-5", "q": "1/4 + 1/4 = ?", "o": ["1/2", "2/8", "1/8", "1/16"], "a": 0, "e": "2/4 = 1/2. Две четвертинки — это половина, а не 2/8."}, {"id": "math-3-6", "q": "Какой общий знаменатель у дробей 1/4 и 1/8?", "o": ["8", "12", "32", "4"], "a": 0, "e": "8 делится на 4 — значит, 8 и будет общим."}, {"id": "math-3-7", "q": "Какой общий знаменатель у дробей 1/2 и 1/3?", "o": ["6", "5", "3", "1"], "a": 0, "e": "Нужно число, делящееся и на 2, и на 3: это 6."}, {"id": "math-3-8", "q": "Наименьший общий знаменатель у 1/4 и 1/6?", "o": ["12", "24", "10", "6"], "a": 0, "e": "Кратные 6: 6, 12. 12 делится на 4. 24 тоже подходит, но не наименьший."}, {"id": "math-3-9", "q": "Общий знаменатель у 2/3 и 1/9?", "o": ["9", "27", "12", "3"], "a": 0, "e": "9 делится на 3 — подходит."}, {"id": "math-3-10", "q": "1/2 = ?/6. Какое число вместо «?»", "o": ["3", "1", "2", "6"], "a": 0, "e": "6 больше 2 в 3 раза — числитель тоже умножаем на 3."}, {"id": "math-3-11", "q": "2/3 = ?/12. Какое число вместо «?»", "o": ["8", "4", "6", "9"], "a": 0, "e": "12 : 3 = 4, значит 2 · 4 = 8."}, {"id": "math-3-12", "q": "Чтобы записать 3/4 со знаменателем 12, нужно…", "o": ["умножить и числитель, и знаменатель на 3", "умножить только знаменатель на 3", "прибавить 8 к знаменателю", "прибавить 8 к числителю и знаменателю"], "a": 0, "e": "Верх и низ умножаем на одно число — дробь не меняется: 9/12."}, {"id": "math-3-13", "q": "1/2 + 1/3 = ?", "o": ["5/6", "2/5", "2/6", "1/6"], "a": 0, "e": "3/6 + 2/6 = 5/6."}, {"id": "math-3-14", "q": "1/2 + 1/4 = ?", "o": ["3/4", "2/6", "2/4", "1/6"], "a": 0, "e": "1/2 = 2/4, 2/4 + 1/4 = 3/4."}, {"id": "math-3-15", "q": "3/4 − 1/6 = ?", "o": ["7/12", "2/10", "1/2", "5/12"], "a": 0, "e": "9/12 − 2/12 = 7/12."}, {"id": "math-3-16", "q": "2/3 − 1/2 = ?", "o": ["1/6", "1/5", "3/6", "1/3"], "a": 0, "e": "4/6 − 3/6 = 1/6."}, {"id": "math-3-17", "q": "1/3 + 1/6 = ?", "o": ["1/2", "2/9", "2/6", "1/9"], "a": 0, "e": "2/6 + 1/6 = 3/6 = 1/2."}, {"id": "math-3-18", "q": "2/5 + 1/10 = ?", "o": ["1/2", "3/15", "3/10", "2/5"], "a": 0, "e": "4/10 + 1/10 = 5/10 = 1/2."}, {"id": "math-3-19", "q": "1 − 3/8 = ?", "o": ["5/8", "3/8", "2/8", "7/8"], "a": 0, "e": "1 = 8/8, 8/8 − 3/8 = 5/8."}, {"id": "math-3-20", "q": "1 − 2/5 = ?", "o": ["3/5", "1/5", "2/5", "4/5"], "a": 0, "e": "5/5 − 2/5 = 3/5."}, {"id": "math-3-21", "q": "2 + 1/3 = ?", "o": ["7/3", "3/3", "2/3", "5/3"], "a": 0, "e": "2 = 6/3, 6/3 + 1/3 = 7/3."}, {"id": "math-3-22", "q": "3/4 + 3/4 = ?", "o": ["3/2 (это 1 целая 1/2)", "6/8", "9/16", "1/2"], "a": 0, "e": "6/4 = 3/2. Две «три четверти» больше целого."}, {"id": "math-3-23", "q": "Выпил 1/4 бутылки, потом ещё 1/2. Сколько выпито всего?", "o": ["3/4", "2/6", "1/6", "2/4"], "a": 0, "e": "1/4 + 2/4 = 3/4."}, {"id": "math-3-24", "q": "Прочитал 3/5 книги. Какая часть осталась?", "o": ["2/5", "3/5", "5/3", "1/5"], "a": 0, "e": "Вся книга — 5/5. 5/5 − 3/5 = 2/5."}, {"id": "math-3-25", "q": "Получилось 4/8. Что сделать в конце?", "o": ["Сократить до 1/2", "Оставить как есть — так правильнее", "Сократить до 2/8", "Перевернуть: 8/4"], "a": 0, "e": "Ответ записывают несократимой дробью."}, {"id": "math-3-26", "q": "Какой первый шаг при сложении 1/3 + 1/4?", "o": ["Найти общий знаменатель", "Сложить знаменатели", "Сложить числители", "Перемножить дроби"], "a": 0, "e": "Пока знаменатели разные, складывать нельзя — сначала уравниваем."}]}, {"id": "math-4", "subject": "Математика", "title": "6.1 Умножение и деление дробей", "order": 22, "theory": "## Умножение — самое простое действие с дробями\nЧислитель умножаем на числитель, знаменатель — на знаменатель.\n\n> 2/3 · 3/4 = (2 · 3)/(3 · 4) = 6/12 = **1/2**\n\nОбщий знаменатель здесь **не нужен** — он нужен только при сложении и вычитании.\n\n! Частая путаница: при сложении знаменатели уравнивают и не трогают, а при умножении их просто перемножают.\n\n## Сокращай до умножения\nЕсли верх одной дроби и низ другой делятся на одно число, сократи их сразу — считать будет легче.\n\n> 2/3 · 3/4: тройка сверху и тройка снизу сокращаются\n> остаётся 2/4 = **1/2**\n\n## Дробь и целое число\nЦелое число умножаем только на числитель.\n\n> 3 · 2/7 = 6/7\n> 4 · 3/8 = 12/8 = 3/2\n\n## Что значит «умножить на дробь»\nУмножить на 1/2 — значит взять половину. Умножить на 3/4 — взять три четверти.\n\n> 1/2 · 8 = 4 (половина от 8)\n> 3/4 от 20: 20 : 4 = 5, 5 · 3 = **15**\n\nПоэтому при умножении на правильную дробь число становится **меньше**.\n\n## Деление — переверни и умножь\nРазделить на дробь — то же, что умножить на перевёрнутую дробь (верх и низ меняются местами).\n\n> 1/2 : 1/4 = 1/2 · 4/1 = 4/2 = **2**\n> Проверка смыслом: сколько четвертинок в половине? Две.\n\n> 3/5 : 2 = 3/5 · 1/2 = **3/10**\n> (целое 2 — это дробь 2/1, перевёрнутая — 1/2)\n\n! Переворачиваем только вторую дробь — ту, НА которую делим.\n\n## Смешанные числа\nСначала переведи их в неправильную дробь, потом умножай или дели.\n\n> 1 целая 1/2 · 2/3 = 3/2 · 2/3 = 6/6 = **1**", "questions": [{"id": "math-4-1", "q": "2/3 · 3/4 = ?", "o": ["1/2", "6/7", "5/12", "8/9"], "a": 0, "e": "Верх на верх: 6, низ на низ: 12. 6/12 = 1/2."}, {"id": "math-4-2", "q": "1/2 · 1/3 = ?", "o": ["1/6", "2/5", "1/5", "2/6"], "a": 0, "e": "1 · 1 = 1, 2 · 3 = 6."}, {"id": "math-4-3", "q": "3/5 · 2/7 = ?", "o": ["6/35", "5/12", "21/10", "6/12"], "a": 0, "e": "3 · 2 = 6, 5 · 7 = 35. Сократить нельзя."}, {"id": "math-4-4", "q": "4/9 · 3/8 = ?", "o": ["1/6", "7/17", "12/17", "32/27"], "a": 0, "e": "12/72 = 1/6. Удобнее сократить сразу: 4 и 8 на 4, 3 и 9 на 3 → 1/3 · 1/2."}, {"id": "math-4-5", "q": "5/6 · 3/10 = ?", "o": ["1/4", "8/16", "50/18", "1/2"], "a": 0, "e": "15/60 = 1/4."}, {"id": "math-4-6", "q": "Нужен ли общий знаменатель при умножении дробей?", "o": ["Нет, знаменатели просто перемножают", "Да, всегда", "Да, если знаменатели разные", "Только для неправильных дробей"], "a": 0, "e": "Общий знаменатель нужен при сложении и вычитании."}, {"id": "math-4-7", "q": "Как умножить две дроби?", "o": ["Числитель на числитель, знаменатель на знаменатель", "Привести к общему знаменателю и перемножить числители", "Перевернуть вторую дробь", "Сложить числители и перемножить знаменатели"], "a": 0, "e": "Самое простое правило из всех действий с дробями."}, {"id": "math-4-8", "q": "3 · 2/7 = ?", "o": ["6/7", "6/21", "5/7", "2/21"], "a": 0, "e": "Целое умножаем только на числитель."}, {"id": "math-4-9", "q": "4 · 3/8 = ?", "o": ["3/2 (это 1 целая 1/2)", "12/32", "7/8", "3/32"], "a": 0, "e": "4 · 3 = 12, получаем 12/8 = 3/2."}, {"id": "math-4-10", "q": "1/2 · 8 = ?", "o": ["4", "16", "1/16", "2"], "a": 0, "e": "Умножить на 1/2 — взять половину."}, {"id": "math-4-11", "q": "Сколько будет 3/4 от 20?", "o": ["15", "5", "60", "12"], "a": 0, "e": "20 : 4 = 5 (одна четверть), 5 · 3 = 15."}, {"id": "math-4-12", "q": "Сколько будет 2/5 от 30?", "o": ["12", "6", "75", "15"], "a": 0, "e": "30 : 5 = 6, 6 · 2 = 12."}, {"id": "math-4-13", "q": "Число 10 умножили на 1/2. Результат…", "o": ["стал меньше: 5", "стал больше: 20", "не изменился", "стал 10/2 — это больше 10"], "a": 0, "e": "Умножить на правильную дробь — взять часть, число уменьшается."}, {"id": "math-4-14", "q": "Правило деления на дробь:", "o": ["перевернуть вторую дробь и умножить", "перевернуть первую дробь и умножить", "разделить числители и знаменатели", "привести к общему знаменателю и умножить"], "a": 0, "e": "a/b : c/d = a/b · d/c."}, {"id": "math-4-15", "q": "Какую дробь переворачивают в примере 2/3 : 4/5?", "o": ["4/5 → 5/4", "2/3 → 3/2", "Обе", "Никакую"], "a": 0, "e": "Переворачивают только ту, НА которую делят."}, {"id": "math-4-16", "q": "1/2 : 1/4 = ?", "o": ["2", "1/8", "1/2", "4"], "a": 0, "e": "1/2 · 4/1 = 4/2 = 2. В половине две четвертинки."}, {"id": "math-4-17", "q": "3/4 : 3/8 = ?", "o": ["2", "9/32", "1/2", "3/4"], "a": 0, "e": "3/4 · 8/3 = 24/12 = 2."}, {"id": "math-4-18", "q": "2/3 : 4/5 = ?", "o": ["5/6", "8/15", "6/5", "2/5"], "a": 0, "e": "2/3 · 5/4 = 10/12 = 5/6."}, {"id": "math-4-19", "q": "3/5 : 2 = ?", "o": ["3/10", "6/5", "3/7", "5/6"], "a": 0, "e": "2 = 2/1, переворачиваем: 1/2. 3/5 · 1/2 = 3/10."}, {"id": "math-4-20", "q": "6 : 1/3 = ?", "o": ["18", "2", "1/18", "3"], "a": 0, "e": "6 · 3/1 = 18. В шести целых 18 третей."}, {"id": "math-4-21", "q": "1 целая 1/2 · 2/3 = ?", "o": ["1", "1 целая 1/3", "2/6", "3/4"], "a": 0, "e": "1 целая 1/2 = 3/2. 3/2 · 2/3 = 6/6 = 1."}, {"id": "math-4-22", "q": "2 целых 1/2 : 1/2 = ?", "o": ["5", "1 целая 1/4", "2 целых 1/4", "4"], "a": 0, "e": "2 целых 1/2 = 5/2. 5/2 · 2/1 = 10/2 = 5."}, {"id": "math-4-23", "q": "Осталось 3/4 пиццы, съели половину остатка. Какую часть целой пиццы съели?", "o": ["3/8", "1/4", "3/2", "1/8"], "a": 0, "e": "Половина от 3/4: 1/2 · 3/4 = 3/8."}, {"id": "math-4-24", "q": "Ленту длиной 3/4 м разрезали на куски по 1/4 м. Сколько кусков?", "o": ["3", "4", "3/16", "1/3"], "a": 0, "e": "3/4 : 1/4 = 3/4 · 4/1 = 3."}, {"id": "math-4-25", "q": "Машина ехала 1/2 часа со скоростью 60 км/ч. Какой путь (s = v · t)?", "o": ["30 км", "120 км", "60,5 км", "1/120 км"], "a": 0, "e": "s = 60 · 1/2 = 30 км."}]}, {"id": "math-5", "subject": "Математика", "title": "6.2 Пропорции", "order": 23, "theory": "## Что такое пропорция\nПропорция — это равенство двух отношений, то есть двух дробей.\n\n> 2/4 = 3/6 (обе равны половине)\n> 1/3 = 5/15\n\n## Главное правило — крест-накрест\nЕсли a/b = c/d, то **a · d = b · c**. Произведения «по диагонали» равны.\n\n> 2/4 = 3/6\n> 2 · 6 = 4 · 3\n> 12 = 12 — верно\n\n## Как найти неизвестное — три шага\n• Перемножь крест-накрест.\n• Посчитай то, что известно.\n• Раздели, чтобы x остался один.\n\n> x/4 = 3/2\n> 1) x · 2 = 4 · 3\n> 2) x · 2 = 12\n> 3) x = 12 : 2 = **6**\n\n> 5/x = 10/4\n> 1) 5 · 4 = x · 10\n> 2) 20 = x · 10\n> 3) x = 20 : 10 = **2**\n\n## Короткий путь\nx = (два числа на другой диагонали перемножить) : (число, которое стоит по диагонали с x).\n\n> x/4 = 3/2: по диагонали с x стоит 2, на другой диагонали 4 и 3\n> x = 4 · 3 : 2 = **6**\n\n## Задачи из жизни — прямая пропорциональность\nЕсли одна величина растёт во столько же раз, что и другая (больше товара — больше денег), составляем пропорцию. Главное — в обеих дробях одинаковый порядок: килограммы к рублям и там, и там.\n\n> 3 кг стоят 240 ₽. Сколько стоят 5 кг?\n> 3/240 = 5/x\n> 3 · x = 240 · 5 = 1200\n> x = 1200 : 3 = **400 ₽**\n\n## Обратная пропорциональность\nБывает наоборот: одна величина растёт — другая уменьшается. Больше рабочих — меньше дней; выше скорость — меньше времени. Тогда произведения пар равны.\n\n> 4 рабочих делают работу за 6 дней. За сколько сделают 8 рабочих?\n> 4 · 6 = 8 · x\n> 24 = 8 · x\n> x = **3 дня**\n\n! В физике это везде: «во сколько раз изменится…». В v = s/t на одном и том же пути скорость и время обратно пропорциональны — едешь вдвое быстрее, тратишь вдвое меньше времени.", "questions": [{"id": "math-5-1", "q": "Пропорция — это…", "o": ["равенство двух дробей (отношений)", "сумма двух дробей", "дробь с одинаковыми числителем и знаменателем", "процент от числа"], "a": 0, "e": "Например, 2/4 = 3/6."}, {"id": "math-5-2", "q": "Верна ли пропорция 2/4 = 3/6?", "o": ["Да", "Нет", "Только если сократить", "Это не пропорция"], "a": 0, "e": "Проверка крест-накрест: 2 · 6 = 12 и 4 · 3 = 12."}, {"id": "math-5-3", "q": "Какая пропорция верна?", "o": ["1/3 = 5/15", "2/3 = 3/4", "1/2 = 2/3", "3/5 = 5/3"], "a": 0, "e": "1 · 15 = 15 и 3 · 5 = 15."}, {"id": "math-5-4", "q": "Если a/b = c/d, то…", "o": ["a · d = b · c", "a · b = c · d", "a + d = b + c", "a · c = b · d"], "a": 0, "e": "Произведения по диагоналям равны."}, {"id": "math-5-5", "q": "x/4 = 3/2. Чему равен x?", "o": ["6", "2", "1,5", "12"], "a": 0, "e": "x · 2 = 4 · 3 = 12, x = 6."}, {"id": "math-5-6", "q": "5/x = 10/4. Чему равен x?", "o": ["2", "8", "12,5", "1/2"], "a": 0, "e": "5 · 4 = 10 · x, 20 = 10x, x = 2."}, {"id": "math-5-7", "q": "x/3 = 8/6. Чему равен x?", "o": ["4", "16", "1", "9"], "a": 0, "e": "x · 6 = 3 · 8 = 24, x = 4."}, {"id": "math-5-8", "q": "2/5 = x/20. Чему равен x?", "o": ["8", "50", "17", "4"], "a": 0, "e": "2 · 20 = 5 · x, 40 = 5x, x = 8."}, {"id": "math-5-9", "q": "7/x = 21/9. Чему равен x?", "o": ["3", "27", "1/3", "63"], "a": 0, "e": "7 · 9 = 21 · x, 63 = 21x, x = 3."}, {"id": "math-5-10", "q": "x/10 = 3/5. Чему равен x?", "o": ["6", "15", "3/50", "8"], "a": 0, "e": "x · 5 = 30, x = 6."}, {"id": "math-5-11", "q": "12/x = 4/5. Чему равен x?", "o": ["15", "9,6", "1/15", "20"], "a": 0, "e": "12 · 5 = 4 · x, 60 = 4x, x = 15."}, {"id": "math-5-12", "q": "x/6 = 1/2. Чему равен x?", "o": ["3", "12", "1/3", "5"], "a": 0, "e": "x · 2 = 6, x = 3."}, {"id": "math-5-13", "q": "Первый шаг в решении x/4 = 3/2:", "o": ["x · 2 = 4 · 3", "x · 4 = 3 · 2", "x = 3/2 − 4", "x + 2 = 4 + 3"], "a": 0, "e": "Перемножаем крест-накрест: x с 2, 4 с 3."}, {"id": "math-5-14", "q": "3 кг яблок стоят 240 ₽. Сколько стоят 5 кг?", "o": ["400 ₽", "144 ₽", "720 ₽", "1200 ₽"], "a": 0, "e": "3/240 = 5/x → 3x = 1200 → x = 400."}, {"id": "math-5-15", "q": "2 тетради стоят 50 ₽. Сколько стоят 6 тетрадей?", "o": ["150 ₽", "300 ₽", "100 ₽", "25 ₽"], "a": 0, "e": "Тетрадей в 3 раза больше — и денег в 3 раза больше."}, {"id": "math-5-16", "q": "Машина за 2 ч проехала 120 км. Сколько проедет за 5 ч с той же скоростью?", "o": ["300 км", "240 км", "48 км", "600 км"], "a": 0, "e": "2/120 = 5/x → 2x = 600 → x = 300."}, {"id": "math-5-17", "q": "На 2 порции нужно 300 г муки. Сколько на 5 порций?", "o": ["750 г", "600 г", "1500 г", "120 г"], "a": 0, "e": "2/300 = 5/x → 2x = 1500 → x = 750."}, {"id": "math-5-18", "q": "Машина тратит 5 л бензина на 100 км. Сколько нужно на 340 км?", "o": ["17 л", "68 л", "20 л", "34 л"], "a": 0, "e": "5/100 = x/340 → 100x = 1700 → x = 17."}, {"id": "math-5-19", "q": "Какая зависимость прямо пропорциональная?", "o": ["Количество товара и его стоимость", "Скорость и время на одном пути", "Число рабочих и число дней", "Длина и ширина прямоугольника одной площади"], "a": 0, "e": "Больше товара — во столько же раз больше денег."}, {"id": "math-5-20", "q": "Какая зависимость обратно пропорциональная?", "o": ["Скорость и время на одном пути", "Количество товара и его стоимость", "Время работы и заработок при почасовой оплате", "Число страниц и время чтения"], "a": 0, "e": "Быстрее едешь — меньше времени тратишь."}, {"id": "math-5-21", "q": "4 рабочих делают работу за 6 дней. За сколько дней её сделают 8 рабочих?", "o": ["3 дня", "12 дней", "6 дней", "2 дня"], "a": 0, "e": "Обратная пропорциональность: 4 · 6 = 8 · x, x = 3."}, {"id": "math-5-22", "q": "Со скоростью 60 км/ч путь занимает 3 ч. Сколько займёт со скоростью 90 км/ч?", "o": ["2 ч", "4,5 ч", "1,5 ч", "3 ч"], "a": 0, "e": "Путь одинаковый: 60 · 3 = 90 · x, 180 = 90x, x = 2."}, {"id": "math-5-23", "q": "Скорость увеличили в 2 раза, путь тот же. Время…", "o": ["уменьшится в 2 раза", "увеличится в 2 раза", "не изменится", "уменьшится на 2 часа"], "a": 0, "e": "t = s / v: если v больше вдвое, t вдвое меньше."}, {"id": "math-5-24", "q": "3 кг стоят 240 ₽. Ученик записал 3/240 = x/5. В чём ошибка?", "o": ["Перепутан порядок: слева кг/₽, справа ₽/кг", "Ошибки нет", "Нужно было сложить 3 и 5", "Пропорцию тут составлять нельзя"], "a": 0, "e": "Правильно: 3/240 = 5/x — в обеих дробях кг сверху, рубли снизу."}]}, {"id": "math-6", "subject": "Математика", "title": "6.3 Отрицательные числа", "order": 24, "theory": "## Что это такое\nОтрицательные числа — это числа меньше нуля. Проще всего представить **градусник** или **долг**.\n\n> −5 °C — на 5 градусов холоднее нуля\n> −300 ₽ на счёте — долг 300 рублей\n\nНа числовой прямой отрицательные числа стоят слева от нуля:\n> … −3, −2, −1, 0, 1, 2, 3 …\n\n## Сравнение\nЧем левее число на прямой, тем оно меньше.\n• Любое отрицательное меньше нуля и меньше любого положительного: −100 меньше, чем 1.\n• Из двух отрицательных больше то, что ближе к нулю: −2 больше, чем −7 (−2 °C теплее, чем −7 °C).\n\n## Модуль\nМодуль — это расстояние до нуля, без знака. Пишут так: |−5| = 5, |3| = 3.\n\n## Сложение и вычитание — думай про деньги\nПлюс — получаешь деньги, минус — отдаёшь.\n\n> −5 + 3 = **−2** (был долг 5, вернул 3 — остался долг 2)\n> −5 − 3 = **−8** (был долг 5, занял ещё 3)\n> 3 − 7 = **−4** (было 3, потратил 7 — ушёл в минус на 4)\n\nПравило без денег:\n• Знаки одинаковые — модули складываем, знак оставляем.\n• Знаки разные — из большего модуля вычитаем меньший, знак берём у того, чей модуль больше.\n\n> −6 + 2: модули 6 и 2, разница 4, больше у −6 → **−4**\n> −2 + 6: разница 4, больше у 6 → **4**\n\n## Вычитание отрицательного\nМинус перед отрицательным числом превращается в плюс.\n\n> 5 − (−3) = 5 + 3 = **8**\n> −4 − (−1) = −4 + 1 = **−3**\n\n## Умножение и деление — правило знаков\n• плюс на плюс = плюс\n• минус на минус = **плюс**\n• плюс на минус = минус\n\n> −4 · (−3) = **12**\n> −4 · 3 = **−12**\n> −20 : 5 = **−4**\n> −20 : (−5) = **4**\n\n! Если множителей много, посчитай минусы: чётное число — ответ положительный, нечётное — отрицательный. (−1) · (−1) · (−1) = −1.", "questions": [{"id": "math-6-1", "q": "Какое число меньше: −7 или −2?", "o": ["−7", "−2", "Они равны", "Сравнить нельзя"], "a": 0, "e": "−7 дальше от нуля влево. −7 °C холоднее, чем −2 °C."}, {"id": "math-6-2", "q": "Что больше: −100 или 1?", "o": ["1", "−100", "Они равны", "Сравнить нельзя"], "a": 0, "e": "Любое положительное число больше любого отрицательного."}, {"id": "math-6-3", "q": "Где холоднее: −3 °C или −10 °C?", "o": ["−10 °C", "−3 °C", "Одинаково", "Зависит от ветра"], "a": 0, "e": "Чем меньше число, тем холоднее."}, {"id": "math-6-4", "q": "|−8| = ?", "o": ["8", "−8", "0", "16"], "a": 0, "e": "Модуль — расстояние до нуля, без знака."}, {"id": "math-6-5", "q": "−5 + 3 = ?", "o": ["−2", "2", "−8", "8"], "a": 0, "e": "Долг 5, вернул 3 — долг 2."}, {"id": "math-6-6", "q": "−5 − 3 = ?", "o": ["−8", "−2", "8", "2"], "a": 0, "e": "Долг 5, занял ещё 3 — долг 8."}, {"id": "math-6-7", "q": "3 − 7 = ?", "o": ["−4", "4", "−10", "10"], "a": 0, "e": "Было 3, потратил 7 — в минусе на 4."}, {"id": "math-6-8", "q": "−6 + 2 = ?", "o": ["−4", "4", "−8", "8"], "a": 0, "e": "Знаки разные: 6 − 2 = 4, знак у большего модуля (−6) — минус."}, {"id": "math-6-9", "q": "−2 + 6 = ?", "o": ["4", "−4", "8", "−8"], "a": 0, "e": "6 − 2 = 4, знак у большего модуля (6) — плюс."}, {"id": "math-6-10", "q": "−9 + 9 = ?", "o": ["0", "−18", "18", "−1"], "a": 0, "e": "Долг 9 полностью вернули."}, {"id": "math-6-11", "q": "5 − (−3) = ?", "o": ["8", "2", "−8", "−2"], "a": 0, "e": "Минус на минус даёт плюс: 5 + 3 = 8."}, {"id": "math-6-12", "q": "−4 − (−1) = ?", "o": ["−3", "−5", "3", "5"], "a": 0, "e": "−4 + 1 = −3."}, {"id": "math-6-13", "q": "−10 + (−5) = ?", "o": ["−15", "−5", "15", "5"], "a": 0, "e": "Знаки одинаковые: 10 + 5 = 15, знак минус."}, {"id": "math-6-14", "q": "0 − 6 = ?", "o": ["−6", "6", "0", "60"], "a": 0, "e": "Из нуля вычли 6 — ушли в минус."}, {"id": "math-6-15", "q": "−4 · (−3) = ?", "o": ["12", "−12", "−7", "7"], "a": 0, "e": "Минус на минус — плюс."}, {"id": "math-6-16", "q": "−4 · 3 = ?", "o": ["−12", "12", "−1", "−7"], "a": 0, "e": "Минус на плюс — минус."}, {"id": "math-6-17", "q": "6 · (−2) = ?", "o": ["−12", "12", "4", "−8"], "a": 0, "e": "Плюс на минус — минус."}, {"id": "math-6-18", "q": "−20 : 5 = ?", "o": ["−4", "4", "−15", "−100"], "a": 0, "e": "Минус на плюс — минус."}, {"id": "math-6-19", "q": "−20 : (−5) = ?", "o": ["4", "−4", "−25", "25"], "a": 0, "e": "Минус на минус — плюс."}, {"id": "math-6-20", "q": "(−1) · (−1) · (−1) = ?", "o": ["−1", "1", "−3", "3"], "a": 0, "e": "Три минуса — нечётное число, ответ отрицательный."}, {"id": "math-6-21", "q": "Было −3 °C, потеплело на 5 градусов. Сколько стало?", "o": ["2 °C", "−8 °C", "8 °C", "−2 °C"], "a": 0, "e": "−3 + 5 = 2."}, {"id": "math-6-22", "q": "На карте было 200 ₽, оплатил покупку на 450 ₽ (ушёл в минус). Какой баланс?", "o": ["−250 ₽", "250 ₽", "−650 ₽", "650 ₽"], "a": 0, "e": "200 − 450 = −250."}, {"id": "math-6-23", "q": "Минус на минус при умножении даёт…", "o": ["плюс", "минус", "ноль", "смотря какие числа"], "a": 0, "e": "Это правило работает всегда."}, {"id": "math-6-24", "q": "В произведении три отрицательных множителя. Ответ будет…", "o": ["отрицательным", "положительным", "нулём", "зависит от чисел"], "a": 0, "e": "Нечётное число минусов — ответ отрицательный."}]}, {"id": "math-7", "subject": "Математика", "title": "7.1 Степени и степени десяти", "order": 25, "theory": "## Что такое степень\nСтепень — это короткая запись умножения числа на само себя.\n\n> 2³ = 2 · 2 · 2 = 8\n> 5² = 5 · 5 = 25\n\nВ записи aⁿ: **a** — основание (что умножаем), **n** — показатель (сколько раз).\n\n! Главная ошибка: 2³ — это НЕ 2 · 3 = 6. Это три двойки, перемноженные между собой.\n\n## Квадрат и куб\nx² читают «икс в квадрате», x³ — «икс в кубе». Названия пришли из геометрии: площадь квадрата со стороной 4 равна 4² = 16, объём куба с ребром 2 равен 2³ = 8.\n\n## Особые случаи\n• a¹ = a. Например, 7¹ = 7\n• a⁰ = 1 для любого числа, кроме нуля: 5⁰ = 1, 100⁰ = 1\n• 1 в любой степени = 1: 1¹⁰⁰ = 1\n\n## Степень и минус\n> (−3)² = (−3) · (−3) = 9\n> −3² = −(3 · 3) = −9 — тут минус стоит вне степени\n\nЧётная степень отрицательного числа даёт плюс, нечётная — минус: (−2)³ = −8.\n\n## Степени десяти — их любит физика\n10ⁿ — это единица и n нулей.\n\n> 10² = 100\n> 10³ = 1000\n> 10⁶ = 1 000 000\n\nТак записывают большие числа: скорость света 3 · 10⁸ м/с = 300 000 000 м/с.\n\n## Отрицательная степень — это деление\nМинус в показателе значит: «1 разделить на это число в обычной степени».\n\n> 10⁻¹ = 1/10 = 0,1\n> 10⁻² = 1/100 = 0,01\n> 10⁻³ = 1/1000 = 0,001\n> 2⁻¹ = 1/2\n\nЧисло от этого **не становится отрицательным**! 10⁻² — это маленькое положительное число 0,01, а не −100 и не −20.\n\nУдобное правило для 10⁻ⁿ: после запятой n знаков, последний из них — единица. 10⁻³ = 0,001 — три знака после запятой.\n\n> 5 · 10⁻³ = 5 · 0,001 = 0,005\n\n! В физике приставки — это степени десяти: кило = 10³ (1 км = 1000 м), санти = 10⁻² (1 см = 0,01 м), милли = 10⁻³ (1 мм = 0,001 м).\n\n## Действия со степенями одного основания\n• При умножении показатели складываются: 10² · 10³ = 10⁵\n• При делении — вычитаются: 10⁵ : 10² = 10³\n• Степень в степени — перемножаются: (10²)³ = 10⁶\n\n> Проверка: 10² · 10³ = 100 · 1000 = 100 000 = 10⁵\n\n## Порядок действий\nСтепень считают после скобок, но раньше умножения: 2 · 3² = 2 · 9 = 18.", "questions": [{"id": "math-7-1", "q": "2³ = ?", "o": ["8", "6", "9", "5"], "a": 0, "e": "2 · 2 · 2 = 8."}, {"id": "math-7-2", "q": "3² = ?", "o": ["9", "6", "5", "27"], "a": 0, "e": "3 · 3 = 9."}, {"id": "math-7-3", "q": "5³ = ?", "o": ["125", "15", "25", "8"], "a": 0, "e": "5 · 5 · 5 = 125."}, {"id": "math-7-4", "q": "Что означает 5 в записи 4⁵?", "o": ["Сколько раз 4 умножают само на себя", "На сколько умножают 4", "Сколько прибавляют к 4", "Сколько раз 4 делят на 5"], "a": 0, "e": "4⁵ = 4 · 4 · 4 · 4 · 4."}, {"id": "math-7-5", "q": "2³ — это…", "o": ["2 · 2 · 2", "2 · 3", "2 + 2 + 2", "3 · 3"], "a": 0, "e": "Три двойки перемножаются."}, {"id": "math-7-6", "q": "7¹ = ?", "o": ["7", "1", "0", "49"], "a": 0, "e": "Число в первой степени равно самому себе."}, {"id": "math-7-7", "q": "5⁰ = ?", "o": ["1", "0", "5", "−5"], "a": 0, "e": "Любое число (кроме 0) в нулевой степени равно 1."}, {"id": "math-7-8", "q": "1¹⁰⁰ = ?", "o": ["1", "100", "0", "101"], "a": 0, "e": "Единицу сколько ни умножай на себя — будет 1."}, {"id": "math-7-9", "q": "(−3)² = ?", "o": ["9", "−9", "6", "−6"], "a": 0, "e": "(−3) · (−3) = 9: минус на минус — плюс."}, {"id": "math-7-10", "q": "−3² = ?", "o": ["−9", "9", "−6", "6"], "a": 0, "e": "Минус вне степени: −(3 · 3) = −9."}, {"id": "math-7-11", "q": "(−2)³ = ?", "o": ["−8", "8", "−6", "6"], "a": 0, "e": "Три минуса — нечётное число, ответ отрицательный."}, {"id": "math-7-12", "q": "10³ = ?", "o": ["1000", "30", "100", "10000"], "a": 0, "e": "Единица и три нуля."}, {"id": "math-7-13", "q": "10⁶ = ?", "o": ["1 000 000", "60", "100 000", "10 000 000"], "a": 0, "e": "Единица и шесть нулей — миллион."}, {"id": "math-7-14", "q": "3 · 10⁸ — это…", "o": ["300 000 000", "3 000 000 000", "24", "30 000 000"], "a": 0, "e": "10⁸ — единица и 8 нулей, умножаем на 3."}, {"id": "math-7-15", "q": "10⁻¹ = ?", "o": ["0,1", "−10", "−1", "0,01"], "a": 0, "e": "10⁻¹ = 1/10 = 0,1."}, {"id": "math-7-16", "q": "10⁻² = ?", "o": ["0,01", "−100", "−20", "0,1"], "a": 0, "e": "10⁻² = 1/10² = 1/100 = 0,01. Минус в степени — это деление, а не отрицательное число."}, {"id": "math-7-17", "q": "10⁻³ = ?", "o": ["0,001", "−1000", "0,0001", "−30"], "a": 0, "e": "1/1000 = 0,001 — три знака после запятой."}, {"id": "math-7-18", "q": "2⁻¹ = ?", "o": ["1/2", "−2", "−1/2", "2"], "a": 0, "e": "2⁻¹ = 1/2¹ = 1/2."}, {"id": "math-7-19", "q": "5 · 10⁻³ = ?", "o": ["0,005", "−5000", "0,05", "0,0005"], "a": 0, "e": "10⁻³ = 0,001, умножаем на 5."}, {"id": "math-7-20", "q": "Число 10⁻² отрицательное?", "o": ["Нет, это 0,01 — маленькое положительное", "Да, это −100", "Да, это −20", "Да, это −0,01"], "a": 0, "e": "Минус в показателе означает деление: 1/100."}, {"id": "math-7-21", "q": "10² · 10³ = ?", "o": ["10⁵", "10⁶", "100⁵", "10¹"], "a": 0, "e": "При умножении показатели складываются: 2 + 3 = 5."}, {"id": "math-7-22", "q": "10⁵ : 10² = ?", "o": ["10³", "10⁷", "10¹⁰", "5²"], "a": 0, "e": "При делении показатели вычитаются: 5 − 2 = 3."}, {"id": "math-7-23", "q": "(10²)³ = ?", "o": ["10⁶", "10⁵", "10⁸", "10⁹"], "a": 0, "e": "Степень в степени — показатели перемножаются: 2 · 3 = 6."}, {"id": "math-7-24", "q": "1 км — это сколько метров?", "o": ["10³ м", "10² м", "10⁻³ м", "10⁶ м"], "a": 0, "e": "Кило = 10³ = 1000."}, {"id": "math-7-25", "q": "1 мм — это сколько метров?", "o": ["10⁻³ м", "10³ м", "10⁻² м", "10⁻¹ м"], "a": 0, "e": "Милли = 10⁻³ = 0,001."}, {"id": "math-7-26", "q": "2 · 3² = ?", "o": ["18", "36", "12", "9"], "a": 0, "e": "Степень раньше умножения: 2 · 9 = 18."}, {"id": "math-7-27", "q": "Площадь квадрата со стороной 6 см:", "o": ["36 см²", "24 см²", "12 см²", "6 см²"], "a": 0, "e": "S = a² = 6 · 6 = 36."}]}, {"id": "math-n1", "subject": "Математика", "title": "5.1 Натуральные числа и округление", "order": 11, "theory": "## Натуральные числа\nЭто числа, которыми считают предметы: 1, 2, 3, 4… Ноль к натуральным не относят.\n\n## Разряды\nОдна и та же цифра значит разное в зависимости от места.\n\n> 4 725: 4 — тысячи, 7 — сотни, 2 — десятки, 5 — единицы\n> 4 725 = 4000 + 700 + 20 + 5\n\nБольшие числа делят пробелами на классы по три цифры, начиная справа: единицы, тысячи, миллионы, миллиарды.\n\n> 12 345 678 → 12 миллионов 345 тысяч 678\n\n## Сравнение\n• Больше цифр — число больше: 1 000 больше, чем 999.\n• Цифр поровну — сравниваем слева направо по разрядам.\n\n> 5 382 и 5 328: тысячи равны (5), сотни равны (3), десятки 8 и 2 → **5 382 больше**\n\nЗнаки: «>» — больше, «<» — меньше. Открытая сторона знака всегда смотрит на большее число.\n\n## Округление\nОкруглить — заменить число близким «круглым».\n• Смотрим на цифру **справа** от разряда, до которого округляем.\n• Если там 0, 1, 2, 3 или 4 — округляемая цифра не меняется, всё справа становится нулями.\n• Если 5, 6, 7, 8 или 9 — округляемую цифру увеличиваем на 1, справа — нули.\n\n> 4 725 до сотен: справа от 7 стоит 2 → **4 700**\n> 4 765 до сотен: справа от 7 стоит 6 → **4 800**\n> 3 950 до сотен: 9 + 1 = 10, переносим → **4 000**\n\n! Знак ≈ значит «приблизительно равно»: 4 725 ≈ 4 700. Смотрят только на одну соседнюю цифру: 149 до сотен — это 100, а не 200.", "questions": [{"id": "math-n1-1", "q": "Что означает цифра 7 в числе 4 725?", "o": ["7 сотен", "7 десятков", "7 тысяч", "7 единиц"], "a": 0, "e": "Считаем справа: единицы (5), десятки (2), сотни (7)."}, {"id": "math-n1-2", "q": "Что означает цифра 2 в числе 4 725?", "o": ["2 десятка", "2 сотни", "2 единицы", "2 тысячи"], "a": 0, "e": "Второй разряд справа — десятки."}, {"id": "math-n1-3", "q": "Какая цифра стоит в разряде сотен числа 6 482?", "o": ["4", "6", "8", "2"], "a": 0, "e": "Справа: 2 — единицы, 8 — десятки, 4 — сотни."}, {"id": "math-n1-4", "q": "Запиши цифрами: двенадцать тысяч пять", "o": ["12 005", "12 500", "1 205", "120 005"], "a": 0, "e": "12 тысяч и 5 единиц: сотни и десятки пустые — пишем нули."}, {"id": "math-n1-5", "q": "Как читается число 3 040 000?", "o": ["Три миллиона сорок тысяч", "Три миллиона четыре тысячи", "Триста сорок тысяч", "Три миллиона четыреста тысяч"], "a": 0, "e": "Классы: 3 | 040 | 000 — 3 миллиона, 40 тысяч."}, {"id": "math-n1-6", "q": "4000 + 300 + 6 = ?", "o": ["4306", "4360", "436", "43006"], "a": 0, "e": "4 тысячи, 3 сотни, 0 десятков, 6 единиц."}, {"id": "math-n1-7", "q": "Какое число больше: 5 382 или 5 328?", "o": ["5 382", "5 328", "Они равны", "Сравнить нельзя"], "a": 0, "e": "Тысячи и сотни равны, десятки: 8 больше 2."}, {"id": "math-n1-8", "q": "Какое число больше: 1 000 или 999?", "o": ["1 000", "999", "Они равны", "Сравнить нельзя"], "a": 0, "e": "В 1 000 четыре цифры, в 999 — три."}, {"id": "math-n1-9", "q": "Какой знак поставить: 7 089 … 7 098?", "o": ["<", ">", "=", "≈"], "a": 0, "e": "Сотни равны (0), десятки: 8 меньше 9."}, {"id": "math-n1-10", "q": "Расставь по возрастанию: 909, 990, 99, 9 009", "o": ["99, 909, 990, 9 009", "9 009, 990, 909, 99", "909, 99, 990, 9 009", "99, 990, 909, 9 009"], "a": 0, "e": "Меньше всего цифр у 99. Из трёхзначных 909 меньше 990."}, {"id": "math-n1-11", "q": "Округли 4 725 до сотен", "o": ["4 700", "4 800", "4 730", "5 000"], "a": 0, "e": "Справа от сотен стоит 2 — меньше 5, сотни не меняем."}, {"id": "math-n1-12", "q": "Округли 4 765 до сотен", "o": ["4 800", "4 700", "4 770", "5 000"], "a": 0, "e": "Справа от сотен стоит 6 — сотни увеличиваем: 7 → 8."}, {"id": "math-n1-13", "q": "Округли 3 950 до сотен", "o": ["4 000", "3 900", "3 000", "3 960"], "a": 0, "e": "Справа 5 — сотни увеличиваем: 9 + 1 = 10, единица уходит в тысячи."}, {"id": "math-n1-14", "q": "Округли 68 до десятков", "o": ["70", "60", "68", "100"], "a": 0, "e": "Справа 8 — десятки увеличиваем."}, {"id": "math-n1-15", "q": "Округли 1 234 до тысяч", "o": ["1 000", "2 000", "1 200", "1 230"], "a": 0, "e": "Справа от тысяч стоит 2 — тысячи не меняем."}, {"id": "math-n1-16", "q": "Округли 25 до десятков", "o": ["30", "20", "25", "10"], "a": 0, "e": "Пятёрка округляется вверх."}, {"id": "math-n1-17", "q": "Округли 149 до сотен", "o": ["100", "200", "150", "140"], "a": 0, "e": "Смотрим только на соседнюю цифру — 4. Девятка дальше не важна."}, {"id": "math-n1-18", "q": "При округлении до сотен смотрят на цифру…", "o": ["десятков", "сотен", "единиц", "тысяч"], "a": 0, "e": "Всегда на ту, что справа от нужного разряда."}, {"id": "math-n1-19", "q": "Что означает знак ≈?", "o": ["Приблизительно равно", "Не равно", "Больше или равно", "Точно равно"], "a": 0, "e": "Им записывают округлённые значения."}, {"id": "math-n1-20", "q": "Ноль — натуральное число?", "o": ["Нет", "Да", "Иногда", "Только в физике"], "a": 0, "e": "Натуральные начинаются с 1 — это числа для счёта предметов."}, {"id": "math-n1-21", "q": "Сколько тысяч в одном миллионе?", "o": ["1000", "100", "10", "10000"], "a": 0, "e": "1 000 000 = 1000 · 1000."}]}, {"id": "math-n2", "subject": "Математика", "title": "5.2 Сложение, вычитание и умножение столбиком", "order": 12, "theory": "## Сложение столбиком\nПишем числа друг под другом так, чтобы **единицы были под единицами**, десятки под десятками. Складываем справа налево.\n\n> 478 + 256\n> единицы: 8 + 6 = 14 → пишем 4, 1 переносим в десятки\n> десятки: 7 + 5 + 1 = 13 → пишем 3, 1 переносим в сотни\n> сотни: 4 + 2 + 1 = 7\n> Ответ: **734**\n\n## Вычитание столбиком\nТоже справа налево. Если верхняя цифра меньше нижней — «занимаем» десяток у соседа слева: верхняя цифра становится на 10 больше, а у соседа — на 1 меньше.\n\n> 532 − 278\n> единицы: 2 меньше 8, занимаем → 12 − 8 = 4 (у десятков было 3, стало 2)\n> десятки: 2 меньше 7, занимаем → 12 − 7 = 5 (у сотен было 5, стало 4)\n> сотни: 4 − 2 = 2\n> Ответ: **254**\n\n! Вычитание проверяют сложением: 254 + 278 = 532. Сошлось — значит верно.\n\n## Умножение на однозначное число\n> 347 · 6\n> 7 · 6 = 42 → пишем 2, 4 держим в уме\n> 4 · 6 = 24, плюс 4 = 28 → пишем 8, 2 в уме\n> 3 · 6 = 18, плюс 2 = 20 → пишем 20\n> Ответ: **2082**\n\n## Умножение на 10, 100, 1000\nПриписываем столько нулей, сколько их во множителе: 37 · 100 = 3700.\nЕсли нули есть на концах чисел — перемножь без них и допиши все нули в конце:\n> 40 · 30: 4 · 3 = 12, два нуля → **1200**\n\n## Умножение на двузначное\nРазбиваем на десятки и единицы, умножаем по частям, складываем.\n> 23 · 14 = 23 · 10 + 23 · 4 = 230 + 92 = **322**\n\n## Удобные приёмы\n• Множители можно переставлять: 4 · 37 · 25 = 37 · (4 · 25) = 37 · 100 = 3700\n• 99 · 6 = 100 · 6 − 6 = 600 − 6 = 594", "questions": [{"id": "math-n2-1", "q": "478 + 256 = ?", "o": ["734", "624", "724", "634"], "a": 0, "e": "8+6=14 (4, 1 в уме), 7+5+1=13 (3, 1 в уме), 4+2+1=7."}, {"id": "math-n2-2", "q": "365 + 487 = ?", "o": ["852", "742", "842", "752"], "a": 0, "e": "5+7=12, 6+8+1=15, 3+4+1=8."}, {"id": "math-n2-3", "q": "1999 + 1 = ?", "o": ["2000", "1000", "2999", "19910"], "a": 0, "e": "Перенос идёт через все девятки."}, {"id": "math-n2-4", "q": "532 − 278 = ?", "o": ["254", "346", "266", "354"], "a": 0, "e": "Дважды занимаем десяток. Проверка: 254 + 278 = 532."}, {"id": "math-n2-5", "q": "1000 − 1 = ?", "o": ["999", "900", "9999", "990"], "a": 0, "e": "Занимаем через все нули."}, {"id": "math-n2-6", "q": "703 − 258 = ?", "o": ["445", "555", "455", "545"], "a": 0, "e": "Проверка: 445 + 258 = 703."}, {"id": "math-n2-7", "q": "600 − 245 = ?", "o": ["355", "465", "445", "365"], "a": 0, "e": "Проверка: 355 + 245 = 600."}, {"id": "math-n2-8", "q": "Как проверить вычитание?", "o": ["Сложить ответ и вычитаемое — должно получиться уменьшаемое", "Вычесть ещё раз", "Умножить ответ на 2", "Никак"], "a": 0, "e": "532 − 278 = 254 → 254 + 278 = 532."}, {"id": "math-n2-9", "q": "Как правильно записать числа для сложения столбиком?", "o": ["Единицы под единицами", "Первые цифры друг под другом", "Как удобнее", "Большее число снизу"], "a": 0, "e": "Иначе сложатся разные разряды."}, {"id": "math-n2-10", "q": "В примере 532 − 278 из 2 единиц нельзя вычесть 8. Что делать?", "o": ["Занять десяток у соседней цифры", "Вычесть 2 из 8", "Записать 0", "Поменять числа местами"], "a": 0, "e": "2 превращается в 12, а у десятков становится на 1 меньше."}, {"id": "math-n2-11", "q": "347 · 6 = ?", "o": ["2082", "1842", "2042", "2482"], "a": 0, "e": "42 → 2 (4 в уме), 24+4=28 → 8 (2 в уме), 18+2=20."}, {"id": "math-n2-12", "q": "125 · 8 = ?", "o": ["1000", "800", "1600", "960"], "a": 0, "e": "Полезно запомнить: 125 · 8 = 1000."}, {"id": "math-n2-13", "q": "37 · 100 = ?", "o": ["3700", "370", "37000", "137"], "a": 0, "e": "Приписываем два нуля."}, {"id": "math-n2-14", "q": "40 · 30 = ?", "o": ["1200", "120", "12000", "70"], "a": 0, "e": "4 · 3 = 12 и два нуля."}, {"id": "math-n2-15", "q": "23 · 14 = ?", "o": ["322", "230", "312", "92"], "a": 0, "e": "23 · 10 = 230, 23 · 4 = 92, вместе 322."}, {"id": "math-n2-16", "q": "15 · 15 = ?", "o": ["225", "125", "215", "30"], "a": 0, "e": "15 · 10 = 150, 15 · 5 = 75, вместе 225."}, {"id": "math-n2-17", "q": "4 · 37 · 25 = ?", "o": ["3700", "370", "1480", "925"], "a": 0, "e": "Переставим: 4 · 25 = 100, 37 · 100 = 3700."}, {"id": "math-n2-18", "q": "99 · 6 = ?", "o": ["594", "600", "584", "606"], "a": 0, "e": "100 · 6 − 6 = 594."}, {"id": "math-n2-19", "q": "Купил 3 товара по 249 ₽. Сколько заплатил?", "o": ["747 ₽", "727 ₽", "647 ₽", "252 ₽"], "a": 0, "e": "249 · 3 = 747."}]}, {"id": "math-n3", "subject": "Математика", "title": "5.3 Деление и деление с остатком", "order": 13, "theory": "## Что такое деление\nДеление обратно умножению: 24 : 6 = 4, потому что 4 · 6 = 24. Значит, таблица умножения — это и таблица деления.\n\n• Делимое : делитель = частное\n• Делить на 0 **нельзя**. А 0 : 5 = 0.\n\n## Деление уголком (в столбик)\nДелим по частям, начиная слева.\n\n> 756 : 3\n> 7 : 3 = 2 (2 · 3 = 6), остаток 1\n> сносим 5 → 15 : 3 = 5\n> сносим 6 → 6 : 3 = 2\n> Ответ: **252**. Проверка: 252 · 3 = 756\n\nЕсли очередное число меньше делителя — в ответ пишем **0** и сносим следующую цифру.\n\n> 612 : 6\n> 6 : 6 = 1\n> сносим 1 → 1 : 6 = **0**\n> сносим 2 → 12 : 6 = 2\n> Ответ: **102** (а не 12!)\n\n## Деление с остатком\nНацело делится не всегда. Тогда остаётся остаток.\n\n> 17 : 5 = 3 (ост. 2), потому что 5 · 3 = 15 и 17 − 15 = 2\n\n! Остаток всегда **меньше делителя**. Если получился больше
