 — частное подобрано неправильно.\n\nПроверка: делитель · частное + остаток = делимое. 5 · 3 + 2 = 17.\n\n## Признаки делимости\n• На 2 — последняя цифра чётная (0, 2, 4, 6, 8)\n• На 5 — последняя цифра 0 или 5\n• На 10 — последняя цифра 0\n• На 3 — сумма цифр делится на 3: 471 → 4 + 7 + 1 = 12 → делится\n• На 9 — сумма цифр делится на 9\n\n## Деление на 10, 100…\nОтбрасываем нули в конце: 3700 : 100 = 37. Если нули есть у обоих чисел, их можно одинаково убрать: 4800 : 40 = 480 : 4 = 120.", "questions": [{"id": "math-n3-1", "q": "56 : 7 = ?", "o": ["8", "7", "9", "6"], "a": 0, "e": "8 · 7 = 56."}, {"id": "math-n3-2", "q": "72 : 9 = ?", "o": ["8", "7", "9", "6"], "a": 0, "e": "8 · 9 = 72."}, {"id": "math-n3-3", "q": "0 : 5 = ?", "o": ["0", "5", "1", "Нельзя"], "a": 0, "e": "Ноль разделить на что угодно (кроме нуля) — ноль."}, {"id": "math-n3-4", "q": "5 : 0 = ?", "o": ["Делить на ноль нельзя", "0", "5", "1"], "a": 0, "e": "Нет такого числа, которое при умножении на 0 даёт 5."}, {"id": "math-n3-5", "q": "756 : 3 = ?", "o": ["252", "251", "225", "2052"], "a": 0, "e": "7:3=2 (ост. 1), 15:3=5, 6:3=2."}, {"id": "math-n3-6", "q": "612 : 6 = ?", "o": ["102", "12", "120", "1002"], "a": 0, "e": "Когда 1 не делится на 6, в ответ пишем 0."}, {"id": "math-n3-7", "q": "848 : 4 = ?", "o": ["212", "202", "222", "2012"], "a": 0, "e": "8:4=2, 4:4=1, 8:4=2."}, {"id": "math-n3-8", "q": "1000 : 8 = ?", "o": ["125", "12", "120", "1250"], "a": 0, "e": "125 · 8 = 1000."}, {"id": "math-n3-9", "q": "3700 : 100 = ?", "o": ["37", "370", "3,7", "307"], "a": 0, "e": "Отбрасываем два нуля."}, {"id": "math-n3-10", "q": "4800 : 40 = ?", "o": ["120", "12", "1200", "480"], "a": 0, "e": "Убираем по нулю: 480 : 4 = 120."}, {"id": "math-n3-11", "q": "17 : 5 = ?", "o": ["3 (ост. 2)", "3 (ост. 3)", "2 (ост. 7)", "4 (ост. 3)"], "a": 0, "e": "5 · 3 = 15, 17 − 15 = 2."}, {"id": "math-n3-12", "q": "29 : 4 = ?", "o": ["7 (ост. 1)", "6 (ост. 5)", "7 (ост. 3)", "8 (ост. 1)"], "a": 0, "e": "4 · 7 = 28, 29 − 28 = 1. Вариант «6 (ост. 5)» неверен: остаток больше делителя."}, {"id": "math-n3-13", "q": "50 : 6 = ?", "o": ["8 (ост. 2)", "7 (ост. 8)", "8 (ост. 4)", "9 (ост. 2)"], "a": 0, "e": "6 · 8 = 48, 50 − 48 = 2."}, {"id": "math-n3-14", "q": "Остаток при делении всегда…", "o": ["меньше делителя", "больше делителя", "равен делителю", "меньше частного"], "a": 0, "e": "Если остаток больше делителя — можно было взять частное побольше."}, {"id": "math-n3-15", "q": "Может ли при делении на 4 получиться остаток 5?", "o": ["Нет", "Да", "Только у больших чисел", "Только у чётных"], "a": 0, "e": "Остаток меньше делителя: при делении на 4 бывает 0, 1, 2 или 3."}, {"id": "math-n3-16", "q": "Как проверить, что 17 : 5 = 3 (ост. 2)?", "o": ["5 · 3 + 2 = 17", "5 · 3 − 2 = 17", "17 · 5 + 2", "3 + 2 = 5"], "a": 0, "e": "Делитель · частное + остаток = делимое."}, {"id": "math-n3-17", "q": "Какое число делится на 3?", "o": ["471", "472", "473", "475"], "a": 0, "e": "Сумма цифр 4 + 7 + 1 = 12 делится на 3."}, {"id": "math-n3-18", "q": "Какое число делится на 5?", "o": ["1235", "1234", "1236", "1238"], "a": 0, "e": "Оканчивается на 5."}, {"id": "math-n3-19", "q": "Какое число делится на 9?", "o": ["729", "727", "739", "728"], "a": 0, "e": "7 + 2 + 9 = 18 — делится на 9."}, {"id": "math-n3-20", "q": "25 человек едут на машинах, в каждую помещается 4. Сколько машин нужно?", "o": ["7", "6", "6 (ост. 1)", "5"], "a": 0, "e": "25 : 4 = 6 (ост. 1). Для одного оставшегося нужна ещё машина."}, {"id": "math-n3-21", "q": "20 конфет поровну делят на 3 детей. Сколько каждому?", "o": ["По 6, и 2 останутся", "По 7", "По 6, и 1 останется", "По 5, и 5 останутся"], "a": 0, "e": "20 : 3 = 6 (ост. 2)."}]}, {"id": "math-n4", "subject": "Математика", "title": "5.5 Выражения с буквами и простые уравнения", "order": 15, "theory": "## Зачем нужны буквы\nБуква заменяет число, которое неизвестно или может меняться. Это язык формул в физике: s = v · t — путь равен скорости, умноженной на время, при любых числах.\n\n## Как записывают умножение\nМежду числом и буквой или между буквами знак умножения обычно не пишут:\n> 3a = 3 · a\n> ab = a · b\n> 2(x + 1) = 2 · (x + 1)\n\n## Значение выражения\nПодставь число вместо буквы и посчитай.\n> 3a + 5 при a = 4: 3 · 4 + 5 = **17**\n> s = v · t при v = 60, t = 2: s = 60 · 2 = **120**\n\n## Подобные слагаемые\nСкладывать можно только одинаковое с одинаковым:\n> 3a + 2a = 5a (3 яблока + 2 яблока = 5 яблок)\n> 7x − x = 6x (просто x — это 1x)\n> 2a + 3b — сложить нельзя, буквы разные\n\n## Уравнение\nУравнение — равенство с неизвестным числом. Решить его — найти, при каком x равенство становится верным.\n\n## Как решать — обратным действием\n• Неизвестное слагаемое = сумма − известное\n> x + 5 = 12 → x = 12 − 5 = **7**\n• Неизвестное уменьшаемое = разность + вычитаемое\n> x − 4 = 9 → x = 9 + 4 = **13**\n• Неизвестное вычитаемое = уменьшаемое − разность\n> 20 − x = 8 → x = 20 − 8 = **12**\n• Неизвестный множитель = произведение : известный множитель\n> 3x = 18 → x = 18 : 3 = **6**\n• Неизвестное делимое = частное · делитель\n> x : 4 = 5 → x = 5 · 4 = **20**\n• Неизвестный делитель = делимое : частное\n> 24 : x = 6 → x = 24 : 6 = **4**\n\n## Уравнения в два шага\nСначала убираем сложение или вычитание, потом умножение.\n> 2x − 4 = 10\n> 2x = 10 + 4 = 14\n> x = 14 : 2 = **7**\n\n! Всегда делай проверку — подставь ответ в уравнение: 2 · 7 − 4 = 10. Сошлось.", "questions": [{"id": "math-n4-1", "q": "Что означает запись 3a?", "o": ["3 · a", "3 + a", "3 − a", "a в третьей степени"], "a": 0, "e": "Знак умножения между числом и буквой не пишут."}, {"id": "math-n4-2", "q": "Что означает запись 5xy?", "o": ["5 · x · y", "5 + x + y", "5x + y", "5 · (x + y)"], "a": 0, "e": "Всё, что записано подряд, перемножается."}, {"id": "math-n4-3", "q": "Найди значение 3a + 5 при a = 4", "o": ["17", "39", "12", "35"], "a": 0, "e": "3 · 4 + 5 = 12 + 5 = 17."}, {"id": "math-n4-4", "q": "Найди значение 2x − 1 при x = 6", "o": ["11", "13", "20", "5"], "a": 0, "e": "2 · 6 − 1 = 11."}, {"id": "math-n4-5", "q": "s = v · t. Найди s при v = 60, t = 2", "o": ["120", "62", "30", "58"], "a": 0, "e": "60 · 2 = 120."}, {"id": "math-n4-6", "q": "Найди a + b при a = 15, b = 7", "o": ["22", "8", "105", "157"], "a": 0, "e": "15 + 7 = 22."}, {"id": "math-n4-7", "q": "Упрости: 3a + 2a", "o": ["5a", "6a", "5a²", "5"], "a": 0, "e": "3 яблока + 2 яблока = 5 яблок."}, {"id": "math-n4-8", "q": "Упрости: 7x − x", "o": ["6x", "7", "6", "7x"], "a": 0, "e": "x — это 1x. 7 − 1 = 6."}, {"id": "math-n4-9", "q": "Упрости: 4a + 3b + a", "o": ["5a + 3b", "8ab", "8a", "4a + 4b"], "a": 0, "e": "Складываем только «a» с «a»: 4a + a = 5a."}, {"id": "math-n4-10", "q": "Можно ли упростить 2a + 3b?", "o": ["Нет, буквы разные", "Да, будет 5ab", "Да, будет 5", "Да, будет 6ab"], "a": 0, "e": "Нельзя сложить яблоки с грушами в одно число."}, {"id": "math-n4-11", "q": "x + 5 = 12. Чему равен x?", "o": ["7", "17", "60", "2,4"], "a": 0, "e": "Неизвестное слагаемое: 12 − 5 = 7."}, {"id": "math-n4-12", "q": "x − 4 = 9. Чему равен x?", "o": ["13", "5", "36", "−5"], "a": 0, "e": "Неизвестное уменьшаемое: 9 + 4 = 13."}, {"id": "math-n4-13", "q": "20 − x = 8. Чему равен x?", "o": ["12", "28", "160", "2,5"], "a": 0, "e": "Неизвестное вычитаемое: 20 − 8 = 12."}, {"id": "math-n4-14", "q": "3x = 18. Чему равен x?", "o": ["6", "15", "21", "54"], "a": 0, "e": "Неизвестный множитель: 18 : 3 = 6."}, {"id": "math-n4-15", "q": "x : 4 = 5. Чему равен x?", "o": ["20", "1,25", "9", "1"], "a": 0, "e": "Неизвестное делимое: 5 · 4 = 20."}, {"id": "math-n4-16", "q": "24 : x = 6. Чему равен x?", "o": ["4", "144", "18", "30"], "a": 0, "e": "Неизвестный делитель: 24 : 6 = 4."}, {"id": "math-n4-17", "q": "2x − 4 = 10. Чему равен x?", "o": ["7", "3", "5", "12"], "a": 0, "e": "2x = 14, x = 7."}, {"id": "math-n4-18", "q": "3x + 2 = 17. Чему равен x?", "o": ["5", "6", "15", "19"], "a": 0, "e": "3x = 15, x = 5."}, {"id": "math-n4-19", "q": "4x − 3 = 25. Чему равен x?", "o": ["7", "5,5", "28", "6"], "a": 0, "e": "4x = 28, x = 7."}, {"id": "math-n4-20", "q": "Как проверить, правильно ли решено уравнение?", "o": ["Подставить ответ вместо x", "Решить ещё раз так же", "Сравнить с соседом", "Никак"], "a": 0, "e": "Если после подстановки равенство верное — ответ правильный."}, {"id": "math-n4-21", "q": "Задумали число, прибавили 8, получили 15. Какое уравнение?", "o": ["x + 8 = 15", "x − 8 = 15", "8x = 15", "x + 15 = 8"], "a": 0, "e": "Неизвестное число + 8 = 15."}, {"id": "math-n4-22", "q": "Периметр квадрата P = 4a. Найди P при a = 7 см", "o": ["28 см", "11 см", "47 см", "49 см"], "a": 0, "e": "4 · 7 = 28."}]}, {"id": "math-n5", "subject": "Математика", "title": "5.8 Десятичные дроби: запись и сравнение", "order": 18, "theory": "## Что такое десятичная дробь\nЭто дробь со знаменателем 10, 100, 1000…, записанная через запятую.\n\n> 3/10 = 0,3 — три десятых\n> 25/100 = 0,25 — двадцать пять сотых\n> 7/1000 = 0,007 — семь тысячных\n\nДо запятой — целая часть, после — дробная.\n\n## Разряды после запятой\n• 1-я цифра — десятые\n• 2-я — сотые\n• 3-я — тысячные\n\n> 4,375: 4 целых, 3 десятых, 7 сотых, 5 тысячных\n\n! Сколько нулей в знаменателе — столько цифр после запятой: 7/1000 = 0,007 (три знака).\n\n## Нули в конце не важны\n0,5 = 0,50 = 0,500. А вот нули сразу после запятой важны: 0,05 — это совсем не 0,5.\n\n## Сравнение\n• Сначала сравни целые части: 3,9 меньше, чем 4,1.\n• Если целые равны — допиши нули, чтобы знаков после запятой стало поровну, и сравни как обычные числа.\n\n> 0,7 и 0,65 → 0,70 и 0,65 → **0,7 больше**\n\n! Ловушка: кажется, что 0,65 больше, ведь «65 больше 7». Но сравнивают разряд за разрядом слева: 7 десятых больше 6 десятых.\n\n## Перевод обыкновенной дроби в десятичную\nДоведи знаменатель до 10, 100 или 1000:\n> 1/2 = 5/10 = 0,5\n> 1/4 = 25/100 = 0,25\n> 3/5 = 6/10 = 0,6\n\nИли просто раздели числитель на знаменатель: 3/4 = 3 : 4 = 0,75.\n\n## Округление\nКак с обычными числами — смотрим на цифру справа.\n> 3,46 до десятых → 3,5\n> 2,84 до десятых → 2,8\n> 7,6 до целых → 8", "questions": [{"id": "math-n5-1", "q": "Запиши 3/10 десятичной дробью", "o": ["0,3", "3,10", "0,03", "3,1"], "a": 0, "e": "Три десятых — одна цифра после запятой."}, {"id": "math-n5-2", "q": "Запиши 25/100 десятичной дробью", "o": ["0,25", "2,5", "0,025", "25,1"], "a": 0, "e": "Сотые — две цифры после запятой."}, {"id": "math-n5-3", "q": "Запиши 7/1000 десятичной дробью", "o": ["0,007", "0,7", "0,07", "7000"], "a": 0, "e": "Тысячные — три цифры после запятой."}, {"id": "math-n5-4", "q": "Какая обыкновенная дробь равна 0,4?", "o": ["4/10", "4/100", "1/4", "40/10"], "a": 0, "e": "Одна цифра после запятой — десятые."}, {"id": "math-n5-5", "q": "Какая цифра стоит в разряде сотых числа 4,375?", "o": ["7", "3", "5", "4"], "a": 0, "e": "После запятой: 3 — десятые, 7 — сотые."}, {"id": "math-n5-6", "q": "Как читается 2,05?", "o": ["Две целых пять сотых", "Две целых пять десятых", "Двадцать пять сотых", "Две целых пятьдесят сотых"], "a": 0, "e": "0 стоит в десятых, 5 — в сотых."}, {"id": "math-n5-7", "q": "Верно ли, что 0,5 = 0,50?", "o": ["Да", "Нет", "Только приблизительно", "Зависит от задачи"], "a": 0, "e": "Нули в конце дробной части не меняют число."}, {"id": "math-n5-8", "q": "Верно ли, что 0,05 = 0,5?", "o": ["Нет", "Да", "Только приблизительно", "Зависит от задачи"], "a": 0, "e": "0,05 — пять сотых, 0,5 — пять десятых (в 10 раз больше)."}, {"id": "math-n5-9", "q": "Что больше: 0,7 или 0,65?", "o": ["0,7", "0,65", "Они равны", "Сравнить нельзя"], "a": 0, "e": "0,70 и 0,65: семь десятых больше шести."}, {"id": "math-n5-10", "q": "Что больше: 3,9 или 4,1?", "o": ["4,1", "3,9", "Они равны", "Сравнить нельзя"], "a": 0, "e": "Целые части: 4 больше 3."}, {"id": "math-n5-11", "q": "Что больше: 0,3 или 0,29?", "o": ["0,3", "0,29", "Они равны", "Сравнить нельзя"], "a": 0, "e": "0,30 и 0,29."}, {"id": "math-n5-12", "q": "Что меньше: 1,05 или 1,5?", "o": ["1,05", "1,5", "Они равны", "Сравнить нельзя"], "a": 0, "e": "1,05 и 1,50: в десятых 0 меньше 5."}, {"id": "math-n5-13", "q": "Расставь по возрастанию: 0,5; 0,05; 0,55", "o": ["0,05; 0,5; 0,55", "0,5; 0,05; 0,55", "0,55; 0,5; 0,05", "0,05; 0,55; 0,5"], "a": 0, "e": "0,05 = 0,05; 0,5 = 0,50; 0,55."}, {"id": "math-n5-14", "q": "1/2 в десятичной записи:", "o": ["0,5", "1,2", "0,12", "2,1"], "a": 0, "e": "1/2 = 5/10."}, {"id": "math-n5-15", "q": "1/4 в десятичной записи:", "o": ["0,25", "1,4", "0,4", "0,14"], "a": 0, "e": "1/4 = 25/100."}, {"id": "math-n5-16", "q": "3/5 в десятичной записи:", "o": ["0,6", "3,5", "0,35", "0,53"], "a": 0, "e": "3/5 = 6/10."}, {"id": "math-n5-17", "q": "3/4 в десятичной записи:", "o": ["0,75", "3,4", "0,34", "0,7"], "a": 0, "e": "3 : 4 = 0,75."}, {"id": "math-n5-18", "q": "1/5 в десятичной записи:", "o": ["0,2", "1,5", "0,5", "0,15"], "a": 0, "e": "1/5 = 2/10."}, {"id": "math-n5-19", "q": "Округли 3,46 до десятых", "o": ["3,5", "3,4", "3,46", "4"], "a": 0, "e": "Справа от десятых — 6, увеличиваем: 4 → 5."}, {"id": "math-n5-20", "q": "Округли 2,84 до десятых", "o": ["2,8", "2,9", "3", "2,85"], "a": 0, "e": "Справа — 4, десятые не меняем."}, {"id": "math-n5-21", "q": "Округли 7,6 до целых", "o": ["8", "7", "7,5", "6"], "a": 0, "e": "Справа от целых — 6, увеличиваем."}, {"id": "math-n5-22", "q": "Округли 12,349 до сотых", "o": ["12,35", "12,34", "12,3", "12,4"], "a": 0, "e": "Справа от сотых — 9, увеличиваем: 4 → 5."}]}, {"id": "math-n6", "subject": "Математика", "title": "5.9 Действия с десятичными дробями", "order": 19, "theory": "## Сложение и вычитание — запятая под запятой\nПишем числа столбиком так, чтобы **запятая была под запятой**. Пустые места дополняем нулями. Дальше считаем как обычно, запятую в ответе ставим под запятыми.\n\n> 3,5 + 1,27 → 3,50 + 1,27 = **4,77**\n> 5 − 1,3 → 5,0 − 1,3 = **3,7**\n\n! Ошибка: 0,5 + 0,25 = 0,30. Пятёрка в 0,5 — это десятые, а 25 в 0,25 — сотые, их нельзя складывать «как есть». Правильно: 0,50 + 0,25 = 0,75.\n\n## Умножение\nУмножаем как обычные числа, **не обращая внимания на запятые**. Потом считаем, сколько всего цифр после запятой было у обоих множителей, и отделяем столько же в ответе.\n\n> 0,3 · 0,2: 3 · 2 = 6, знаков 1 + 1 = 2 → **0,06**\n> 1,5 · 4: 15 · 4 = 60, один знак → 6,0 = **6**\n> 2,5 · 1,2: 25 · 12 = 300, два знака → 3,00 = **3**\n\n## Умножение и деление на 10, 100, 1000\nПросто переносим запятую:\n• умножить на 10 — запятая вправо на 1 знак, на 100 — на 2, на 1000 — на 3\n• разделить — запятая влево на столько же знаков\n\n> 3,47 · 10 = 34,7\n> 3,47 · 100 = 347\n> 45,6 : 10 = 4,56\n> 45,6 : 1000 = 0,0456\n\n! В физике так переводят единицы: 2,5 км = 2,5 · 1000 = 2500 м; 35 см = 35 : 100 = 0,35 м.\n\n## Деление на целое число\nДелим как обычно. Дошли до запятой в делимом — ставим запятую в ответе. Можно дописывать нули в конце.\n\n> 7,2 : 3 = **2,4**\n> 1 : 4 = 1,00 : 4 = **0,25**\n\n## Деление на десятичную дробь\nПереносим запятую в делителе и в делимом на одинаковое число знаков вправо, чтобы делитель стал целым.\n\n> 1,5 : 0,3 → 15 : 3 = **5**\n> 2,4 : 0,08 → 240 : 8 = **30**", "questions": [{"id": "math-n6-1", "q": "3,5 + 1,27 = ?", "o": ["4,77", "4,32", "1,62", "47,7"], "a": 0, "e": "3,50 + 1,27 = 4,77."}, {"id": "math-n6-2", "q": "0,5 + 0,25 = ?", "o": ["0,75", "0,30", "7,5", "0,57"], "a": 0, "e": "0,50 + 0,25 = 0,75."}, {"id": "math-n6-3", "q": "2,4 + 3,6 = ?", "o": ["6", "5,10", "60", "0,6"], "a": 0, "e": "4 + 6 = 10 десятых = 1 целая. 2 + 3 + 1 = 6."}, {"id": "math-n6-4", "q": "5 − 1,3 = ?", "o": ["3,7", "4,3", "4,7", "3,3"], "a": 0, "e": "5,0 − 1,3 = 3,7."}, {"id": "math-n6-5", "q": "10 − 0,01 = ?", "o": ["9,99", "9,9", "9,09", "0,09"], "a": 0, "e": "10,00 − 0,01 = 9,99."}, {"id": "math-n6-6", "q": "7,25 − 2,5 = ?", "o": ["4,75", "7", "5,2", "4,8"], "a": 0, "e": "7,25 − 2,50 = 4,75."}, {"id": "math-n6-7", "q": "0,3 · 0,2 = ?", "o": ["0,06", "0,6", "6", "0,006"], "a": 0, "e": "3 · 2 = 6, после запятой 2 знака."}, {"id": "math-n6-8", "q": "1,5 · 4 = ?", "o": ["6", "0,6", "60", "5,4"], "a": 0, "e": "15 · 4 = 60, один знак: 6,0."}, {"id": "math-n6-9", "q": "2,5 · 1,2 = ?", "o": ["3", "0,3", "30", "2,6"], "a": 0, "e": "25 · 12 = 300, два знака: 3,00."}, {"id": "math-n6-10", "q": "0,4 · 0,5 = ?", "o": ["0,2", "2", "0,02", "0,9"], "a": 0, "e": "4 · 5 = 20, два знака: 0,20."}, {"id": "math-n6-11", "q": "3,47 · 10 = ?", "o": ["34,7", "347", "0,347", "3,470"], "a": 0, "e": "Запятая вправо на 1 знак."}, {"id": "math-n6-12", "q": "3,47 · 100 = ?", "o": ["347", "34,7", "3470", "0,0347"], "a": 0, "e": "Запятая вправо на 2 знака."}, {"id": "math-n6-13", "q": "45,6 : 10 = ?", "o": ["4,56", "456", "0,456", "45,06"], "a": 0, "e": "Запятая влево на 1 знак."}, {"id": "math-n6-14", "q": "45,6 : 1000 = ?", "o": ["0,0456", "0,456", "45600", "4,56"], "a": 0, "e": "Запятая влево на 3 знака."}, {"id": "math-n6-15", "q": "7,2 : 3 = ?", "o": ["2,4", "24", "0,24", "2,04"], "a": 0, "e": "72 : 3 = 24, запятая на месте: 2,4."}, {"id": "math-n6-16", "q": "1 : 4 = ?", "o": ["0,25", "4", "0,4", "2,5"], "a": 0, "e": "1,00 : 4 = 0,25."}, {"id": "math-n6-17", "q": "1,5 : 0,3 = ?", "o": ["5", "0,5", "50", "0,05"], "a": 0, "e": "Переносим запятую: 15 : 3 = 5."}, {"id": "math-n6-18", "q": "2,4 : 0,08 = ?", "o": ["30", "3", "0,3", "300"], "a": 0, "e": "Переносим на 2 знака: 240 : 8 = 30."}, {"id": "math-n6-19", "q": "2,5 км — сколько это метров?", "o": ["2500 м", "250 м", "25 м", "25 000 м"], "a": 0, "e": "1 км = 1000 м: 2,5 · 1000."}, {"id": "math-n6-20", "q": "35 см — сколько это метров?", "o": ["0,35 м", "3,5 м", "0,035 м", "350 м"], "a": 0, "e": "1 м = 100 см: 35 : 100."}, {"id": "math-n6-21", "q": "Купил 3 шоколадки по 89,90 ₽. Сколько заплатил?", "o": ["269,70 ₽", "268,70 ₽", "269,07 ₽", "92,90 ₽"], "a": 0, "e": "89,90 · 3 = 269,70."}]}, {"id": "math-n7", "subject": "Математика", "title": "5.10 Проценты и среднее арифметическое", "order": 20, "theory": "## Что такое процент\nПроцент — это одна сотая часть. Само слово значит «на сотню».\n\n> 1% = 1/100 = 0,01\n> 10% = 1/10 — десятая часть\n> 25% = 1/4 — четверть\n> 50% = 1/2 — половина\n> 100% — всё целое\n\n## Как найти процент от числа\nСпособ 1: найди 1% (раздели на 100) и умножь на нужное число процентов.\nСпособ 2: переведи проценты в десятичную дробь и умножь.\n\n> 20% от 300: 1% = 300 : 100 = 3, значит 20% = 3 · 20 = **60**\n> или 300 · 0,2 = **60**\n\n## Быстро в уме\n• 10% — раздели на 10: 10% от 450 = 45\n• 50% — раздели на 2\n• 25% — раздели на 4\n• 1% — раздели на 100\n\n## Найти число по его проценту\nНайди 1% и умножь на 100.\n> 15% числа — это 45. 1% = 45 : 15 = 3, всё число = 3 · 100 = **300**\n\n## Скидки и повышения\n> Товар стоит 2000 ₽, скидка 15%. Скидка: 2000 · 0,15 = 300 ₽. Новая цена: **1700 ₽**\n> Зарплату 40 000 ₽ повысили на 10%: прибавка 4000 ₽, стало **44 000 ₽**\n\n## Сколько процентов составляет часть\nРаздели часть на целое и умножь на 100.\n> 12 из 48: 12 : 48 = 0,25 → **25%**\n\n## Среднее арифметическое\nСложи все числа и раздели на их количество.\n> 4, 5 и 3: (4 + 5 + 3) : 3 = 12 : 3 = **4**\n\n! В физике так находят среднее значение по нескольким измерениям. (Средняя скорость — особый случай: весь путь делят на всё время.)", "questions": [{"id": "math-n7-1", "q": "Что такое 1%?", "o": ["Одна сотая часть", "Одна десятая часть", "Одна тысячная часть", "Половина"], "a": 0, "e": "1% = 1/100."}, {"id": "math-n7-2", "q": "50% — это…", "o": ["половина", "четверть", "десятая часть", "всё целое"], "a": 0, "e": "50/100 = 1/2."}, {"id": "math-n7-3", "q": "25% в виде обыкновенной дроби:", "o": ["1/4", "1/25", "2/5", "1/2"], "a": 0, "e": "25/100 = 1/4."}, {"id": "math-n7-4", "q": "10% в виде десятичной дроби:", "o": ["0,1", "0,01", "10", "1,0"], "a": 0, "e": "10/100 = 0,1."}, {"id": "math-n7-5", "q": "5% в виде десятичной дроби:", "o": ["0,05", "0,5", "5", "0,005"], "a": 0, "e": "5/100 = 0,05."}, {"id": "math-n7-6", "q": "0,3 — это сколько процентов?", "o": ["30%", "3%", "0,3%", "300%"], "a": 0, "e": "0,3 = 30/100."}, {"id": "math-n7-7", "q": "10% от 450 = ?", "o": ["45", "4,5", "440", "46"], "a": 0, "e": "Делим на 10."}, {"id": "math-n7-8", "q": "50% от 86 = ?", "o": ["43", "36", "8,6", "172"], "a": 0, "e": "Делим на 2."}, {"id": "math-n7-9", "q": "25% от 200 = ?", "o": ["50", "25", "75", "800"], "a": 0, "e": "Делим на 4."}, {"id": "math-n7-10", "q": "20% от 300 = ?", "o": ["60", "6", "15", "280"], "a": 0, "e": "1% = 3, 20% = 60."}, {"id": "math-n7-11", "q": "1% от 5000 = ?", "o": ["50", "500", "5", "4999"], "a": 0, "e": "Делим на 100."}, {"id": "math-n7-12", "q": "15% от 2000 = ?", "o": ["300", "150", "1700", "30"], "a": 0, "e": "2000 · 0,15 = 300."}, {"id": "math-n7-13", "q": "Товар 2000 ₽, скидка 15%. Сколько он стоит со скидкой?", "o": ["1700 ₽", "300 ₽", "1985 ₽", "1850 ₽"], "a": 0, "e": "Скидка 300 ₽, 2000 − 300 = 1700."}, {"id": "math-n7-14", "q": "Зарплату 40 000 ₽ повысили на 10%. Сколько стало?", "o": ["44 000 ₽", "40 010 ₽", "50 000 ₽", "4 000 ₽"], "a": 0, "e": "10% = 4000, 40 000 + 4000 = 44 000."}, {"id": "math-n7-15", "q": "10% числа равны 30. Какое это число?", "o": ["300", "3", "40", "33"], "a": 0, "e": "Всё число — в 10 раз больше."}, {"id": "math-n7-16", "q": "15% числа равны 45. Какое это число?", "o": ["300", "675", "30", "60"], "a": 0, "e": "1% = 3, 100% = 300."}, {"id": "math-n7-17", "q": "Сколько процентов составляет 12 от 48?", "o": ["25%", "12%", "4%", "36%"], "a": 0, "e": "12 : 48 = 0,25 = 25%."}, {"id": "math-n7-18", "q": "В классе 30 учеников, 6 из них отличники. Сколько это процентов?", "o": ["20%", "6%", "5%", "24%"], "a": 0, "e": "6 : 30 = 0,2 = 20%."}, {"id": "math-n7-19", "q": "Среднее арифметическое чисел 4, 5 и 3:", "o": ["4", "12", "5", "3"], "a": 0, "e": "(4 + 5 + 3) : 3 = 4."}, {"id": "math-n7-20", "q": "Среднее арифметическое чисел 10, 20, 30, 40:", "o": ["25", "100", "20", "30"], "a": 0, "e": "100 : 4 = 25."}, {"id": "math-n7-21", "q": "Время измерили три раза: 2,1 с; 2,3 с; 2,2 с. Среднее значение?", "o": ["2,2 с", "6,6 с", "2,3 с", "2,1 с"], "a": 0, "e": "(2,1 + 2,3 + 2,2) : 3 = 6,6 : 3 = 2,2."}]}, {"id": "math-n8", "subject": "Математика", "title": "5.11 Геометрия: углы, периметр, площадь, объём", "order": 21, "theory": "## Отрезок, луч, прямая\n• **Отрезок** — часть прямой между двумя точками, у него есть длина.\n• **Луч** — начинается в точке и уходит бесконечно в одну сторону.\n• **Прямая** — бесконечна в обе стороны.\n\n## Единицы длины\n> 1 см = 10 мм\n> 1 дм = 10 см\n> 1 м = 100 см = 1000 мм\n> 1 км = 1000 м\n\n## Углы\nУгол — две стороны (луча), выходящие из одной точки — вершины. Измеряют в градусах (°) транспортиром.\n• **Прямой** — ровно 90° (как угол листа бумаги)\n• **Острый** — меньше 90°\n• **Тупой** — больше 90°, но меньше 180°\n• **Развёрнутый** — 180° (стороны образуют прямую)\n• Полный оборот — 360°\n\n! Сумма углов любого треугольника всегда 180°.\n\n## Периметр\nПериметр — длина всей границы фигуры, сумма длин сторон.\n> Прямоугольник 5 см × 3 см: P = 2 · (5 + 3) = **16 см**\n> Квадрат со стороной 4 см: P = 4 · 4 = **16 см**\n\n## Площадь\nПлощадь — сколько квадратиков 1 × 1 помещается внутри. Единицы: см², м².\n> Прямоугольник: S = a · b. Для 5 × 3 → S = **15 см²**\n> Квадрат: S = a · a = a². Сторона 4 → S = **16 см²**\n> Прямоугольный треугольник — половина прямоугольника: S = a · b : 2\n\n! 1 м² = 100 · 100 = 10 000 см² (а не 100!), потому что метр — это 100 см и в длину, и в ширину.\n\n## Объём\nОбъём — сколько кубиков 1 × 1 × 1 помещается внутри. Единицы: см³, м³, литры.\n> Коробка (прямоугольный параллелепипед): V = a · b · c. Для 5 × 3 × 2 → **30 см³**\n> Куб: V = a³. Ребро 3 → **27 см³**\n> 1 литр = 1 дм³ = 1000 см³\n\n## Не путай\n• Периметр — **длина** забора вокруг участка (м)\n• Площадь — сколько **плитки** нужно на пол (м²)\n• Объём — сколько **воды** влезет в бассейн (м³)", "questions": [{"id": "math-n8-1", "q": "Сколько миллиметров в 1 см?", "o": ["10", "100", "1000", "1"], "a": 0, "e": "1 см = 10 мм."}, {"id": "math-n8-2", "q": "Сколько сантиметров в 1 м?", "o": ["100", "10", "1000", "60"], "a": 0, "e": "1 м = 100 см."}, {"id": "math-n8-3", "q": "3 км — сколько это метров?", "o": ["3000", "300", "30 000", "30"], "a": 0, "e": "1 км = 1000 м."}, {"id": "math-n8-4", "q": "250 см — сколько это метров?", "o": ["2,5 м", "25 м", "0,25 м", "250 м"], "a": 0, "e": "250 : 100 = 2,5."}, {"id": "math-n8-5", "q": "Чем отрезок отличается от луча?", "o": ["У отрезка два конца, у луча — один", "Луч короче", "Отрезок бесконечный", "Ничем"], "a": 0, "e": "Луч уходит бесконечно в одну сторону."}, {"id": "math-n8-6", "q": "Сколько градусов в прямом угле?", "o": ["90°", "180°", "45°", "360°"], "a": 0, "e": "Как угол листа бумаги."}, {"id": "math-n8-7", "q": "Угол 120° — какой?", "o": ["Тупой", "Острый", "Прямой", "Развёрнутый"], "a": 0, "e": "Больше 90°, но меньше 180°."}, {"id": "math-n8-8", "q": "Угол 45° — какой?", "o": ["Острый", "Тупой", "Прямой", "Развёрнутый"], "a": 0, "e": "Меньше 90°."}, {"id": "math-n8-9", "q": "Сколько градусов в развёрнутом угле?", "o": ["180°", "90°", "360°", "100°"], "a": 0, "e": "Стороны образуют прямую линию."}, {"id": "math-n8-10", "q": "Два угла треугольника — 60° и 70°. Чему равен третий?", "o": ["50°", "130°", "60°", "230°"], "a": 0, "e": "180 − 60 − 70 = 50."}, {"id": "math-n8-11", "q": "Периметр прямоугольника со сторонами 5 см и 3 см:", "o": ["16 см", "15 см", "8 см", "30 см"], "a": 0, "e": "2 · (5 + 3) = 16."}, {"id": "math-n8-12", "q": "Периметр квадрата со стороной 7 см:", "o": ["28 см", "49 см", "14 см", "21 см"], "a": 0, "e": "4 · 7 = 28."}, {"id": "math-n8-13", "q": "Площадь прямоугольника со сторонами 5 см и 3 см:", "o": ["15 см²", "16 см²", "8 см²", "30 см²"], "a": 0, "e": "5 · 3 = 15."}, {"id": "math-n8-14", "q": "Площадь квадрата со стороной 4 см:", "o": ["16 см²", "8 см²", "12 см²", "4 см²"], "a": 0, "e": "4 · 4 = 16."}, {"id": "math-n8-15", "q": "Прямоугольный треугольник с катетами 6 см и 4 см. Его площадь?", "o": ["12 см²", "24 см²", "10 см²", "20 см²"], "a": 0, "e": "Половина прямоугольника: 6 · 4 : 2 = 12."}, {"id": "math-n8-16", "q": "Сколько квадратных сантиметров в 1 м²?", "o": ["10 000", "100", "1000", "1 000 000"], "a": 0, "e": "100 см · 100 см = 10 000 см²."}, {"id": "math-n8-17", "q": "Объём коробки 5 см × 3 см × 2 см:", "o": ["30 см³", "10 см³", "31 см³", "15 см³"], "a": 0, "e": "5 · 3 · 2 = 30."}, {"id": "math-n8-18", "q": "Объём куба с ребром 3 см:", "o": ["27 см³", "9 см³", "12 см³", "18 см³"], "a": 0, "e": "3 · 3 · 3 = 27."}, {"id": "math-n8-19", "q": "Сколько кубических сантиметров в 1 литре?", "o": ["1000", "100", "10", "10 000"], "a": 0, "e": "1 л = 1 дм³ = 10 · 10 · 10 см³."}, {"id": "math-n8-20", "q": "Аквариум 50 см × 30 см × 40 см. Сколько литров в него помещается?", "o": ["60 л", "600 л", "6 л", "120 л"], "a": 0, "e": "50 · 30 · 40 = 60 000 см³ = 60 л."}, {"id": "math-n8-21", "q": "Участок 20 м × 15 м. Сколько метров сетки нужно на забор вокруг?", "o": ["70 м", "300 м", "35 м", "600 м"], "a": 0, "e": "Это периметр: 2 · (20 + 15) = 70."}, {"id": "math-n8-22", "q": "Чтобы узнать, сколько плитки нужно на пол, ищут…", "o": ["площадь", "периметр", "объём", "угол"], "a": 0, "e": "Плитка покрывает поверхность — это площадь."}, {"id": "math-n8-23", "q": "Комната 4 м × 5 м. Какова площадь пола?", "o": ["20 м²", "18 м²", "9 м²", "40 м²"], "a": 0, "e": "4 · 5 = 20."}]}];

const app = document.getElementById("app");
const LS = "bilety-progress-v1";
let decks = [];            // [{id, subject, title, order, questions:[{id,q,o,a,e}]}]
let prog = {};             // qid -> [right, wrong, lastOk, ts]
let view = {name: "home"};
let loadState = "loading"; // loading | ready | slow | nodb
let db = null, progRef = null, writing = false, dirty = false, isOwner = false;

try { prog = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch (e) { prog = {}; }

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : (m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c); };
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const status = qid => { const p = prog[qid]; return !p ? "new" : (p[2] ? "ok" : "bad"); };
const allQs = () => decks.flatMap(d => d.questions.map(q => ({...q, deck: d.id})));
const subjects = () => { const m = new Map(); decks.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).forEach(d => { if (!m.has(d.subject)) m.set(d.subject, []); m.get(d.subject).push(d); }); return m; };
const count = qs => { let ok = 0, bad = 0; qs.forEach(q => { const s = status(q.id); if (s === "ok") ok++; else if (s === "bad") bad++; }); return {ok, bad, total: qs.length}; };

function bar(c) {
  if (!c.total) return '<div class="bar"></div>';
  return `<div class="bar"><i class="g" style="width:${c.ok / c.total * 100}%"></i><i class="r" style="width:${c.bad / c.total * 100}%"></i></div>`;
}

function saveProgress() {
  try { localStorage.setItem(LS, JSON.stringify(prog)); } catch (e) {}
  if (!progRef) return;
  dirty = true;
  if (writing) return;
  (async () => {
    writing = true;
    while (dirty) {
      dirty = false;
      try { await progRef.set({p: prog}); } catch (e) { if (e && e.code === "invalid_argument") { progRef = null; break; } }
    }
    writing = false;
  })();
}

// ---------- views ----------
function render() {
  if (view.name === "home") return renderHome();
  if (view.name === "subject") return renderSubject();
  if (view.name === "deck") return renderDeck();
  if (view.name === "quiz") return renderQuiz();
  if (view.name === "result") return renderResult();
  if (view.name === "theory") return renderTheory();
}

function renderHome() {
  const qs = allQs(), c = count(qs);
  let h = `<div class="eyebrow">Тренажёр</div><h1>Билеты к сессии</h1>`;
  if (!decks.length) {
    const msg = loadState === "loading" ? "Загружаю вопросы…" :
      loadState === "slow" ? "Вопросы пока не загрузились. Проверьте интернет — страница подхватит их сама." :
      loadState === "nodb" ? "Хранилище вопросов недоступно в этом просмотре. Откройте страницу по ссылке, войдя в свой аккаунт Claude." :
      "Вопросов пока нет. Пришлите Claude конспект или фото тетради и попросите добавить тему — она появится здесь.";
    app.innerHTML = h + `<div class="empty"><h2>Здесь появятся билеты</h2><p class="muted">${msg}</p></div>`;
    return;
  }
  h += `<p class="muted">Выберите предмет.</p>`;
  if (loadState === "slow") h += `<p class="note">Нет связи с хранилищем — показаны последние загруженные вопросы.</p>`;
  h += `<div class="modes">`;
  for (const [subj, ds] of subjects()) {
    const sc = count(ds.flatMap(d => d.questions));
    h += `<button class="deck" data-subj="${esc(subj)}"><div class="deck-top"><span class="deck-title">${esc(subj)}</span>
      <span class="deck-count num">${sc.ok}/${sc.total}</span></div>${bar(sc)}
      <span class="legend num">${ds.length} ${plural(ds.length, "тема", "темы", "тем")}${sc.bad ? ` · ${sc.bad} ${plural(sc.bad, "ошибка", "ошибки", "ошибок")}` : ""}</span></button>`;
  }
  h += `</div><p class="note">Офлайн-копия. Прогресс хранится в этом браузере. Новые темы появятся, когда Claude пришлёт обновлённый файл.</p>`;
  app.innerHTML = h;
  app.querySelectorAll("[data-subj]").forEach(b => b.onclick = () => { view = {name: "subject", subj: b.dataset.subj}; render(); scrollTo(0, 0); });
}

function confirmBlock(id, label, text) {
  if (!isOwner) return "";
  return `<div class="danger"><button class="ghost" id="${id}">${label}</button>
    <div class="confirm" id="${id}-box" hidden><span>${text}</span>
    <div class="row"><button class="del" id="${id}-yes">Удалить</button><button class="mode-sm" id="${id}-no">Отмена</button></div>
    <span class="note" id="${id}-err"></span></div></div>`;
}
function wireConfirm(id, action) {
  const b = app.querySelector("#" + id); if (!b) return;
  const box = app.querySelector("#" + id + "-box");
  b.onclick = () => { box.hidden = false; b.hidden = true; box.scrollIntoView({block: "nearest", behavior: "smooth"}); };
  app.querySelector("#" + id + "-no").onclick = () => { box.hidden = true; b.hidden = false; };
  app.querySelector("#" + id + "-yes").onclick = async e => {
    e.target.disabled = true;
    try { await action(); }
    catch (err) { e.target.disabled = false; app.querySelector("#" + id + "-err").textContent = "Не удалось удалить. Проверьте интернет и попробуйте ещё раз."; }
  };
}
let deleteDecks = async function (ids) {
  for (const id of ids) {
    const d = decks.find(x => x.id === id);
    await db.doc("decks/" + id).delete();
    if (d) d.questions.forEach(q => { delete prog[q.id]; });
  }
  decks = decks.filter(x => !ids.includes(x.id));
  saveProgress();
}

function renderSubject() {
  const ds = subjects().get(view.subj);
  if (!ds) { view = {name: "home"}; return render(); }
  const qs = ds.flatMap(d => d.questions.map(q => ({...q, deck: d.id}))), c = count(qs);
  const bad = qs.filter(q => status(q.id) === "bad");
  const n = Math.min(20, qs.length);
  let h = `<div class="top"><button class="back" id="back">← Предметы</button></div>
    <div class="eyebrow">Предмет</div><h1>${esc(view.subj)}</h1>
    <div class="stats">
    <div class="stat"><b>${c.total}</b><span>${plural(c.total, "вопрос", "вопроса", "вопросов")}</span></div>
    <div class="stat ok"><b>${c.ok}</b><span>решено верно</span></div>
    <div class="stat bad"><b>${c.bad}</b><span>${plural(c.bad, "ошибка", "ошибки", "ошибок")}</span></div></div>
    <div class="modes">
    <button class="primary" id="s-ticket"><span>Билет по предмету · ${n} ${plural(n, "вопрос", "вопроса", "вопросов")}</span><span>→</span></button>
    <button class="mode" id="s-bad" ${bad.length ? "" : "disabled"}><span><strong>Работа над ошибками</strong><small>${bad.length} по всему предмету</small></span><span class="arrow">→</span></button></div>
    <h2>Темы</h2><div class="modes">`;
  for (const d of ds) {
    const dc = count(d.questions);
    h += `<button class="deck" data-deck="${esc(d.id)}"><div class="deck-top"><span class="deck-title">${esc(d.title)}</span>
      <span class="deck-count num">${dc.ok}/${dc.total}</span></div>${bar(dc)}</button>`;
  }
  h += `</div>` + confirmBlock("delsubj", "Удалить предмет целиком", `Удалить «${esc(view.subj)}» — ${ds.length} ${plural(ds.length, "тему", "темы", "тем")} и ${c.total} ${plural(c.total, "вопрос", "вопроса", "вопросов")}? В этой копии их можно вернуть, только открыв новый файл от Claude.`);
  app.innerHTML = h;
  const back = {name: "subject", subj: view.subj};
  app.querySelector("#back").onclick = () => { view = {name: "home"}; render(); };
  app.querySelector("#s-ticket").onclick = () => startQuiz(shuffle(qs).slice(0, n), "Билет: " + view.subj, back);
  app.querySelector("#s-bad").onclick = () => startQuiz(shuffle(bad), view.subj + " · ошибки", back);
  app.querySelectorAll("[data-deck]").forEach(b => b.onclick = () => { view = {name: "deck", id: b.dataset.deck}; render(); scrollTo(0, 0); });
  wireConfirm("delsubj", async () => { await deleteDecks(ds.map(d => d.id)); view = {name: "home"}; render(); scrollTo(0, 0); });
}

function renderDeck() {
  const d = decks.find(x => x.id === view.id);
  if (!d) { view = {name: "home"}; return render(); }
  const c = count(d.questions);
  const bad = d.questions.filter(q => status(q.id) === "bad");
  const fresh = d.questions.filter(q => status(q.id) === "new");
  const n = Math.min(20, d.questions.length);
  app.innerHTML = `<div class="top"><button class="back" id="back">← ${esc(d.subject)}</button></div>
    <div class="eyebrow">${esc(d.subject)}</div><h1>${esc(d.title)}</h1>
    <div class="legend num">${c.ok} из ${c.total} верно · ${c.bad} ${plural(c.bad, "ошибка", "ошибки", "ошибок")} · ${fresh.length} не решено</div>${bar(c)}
    <div class="modes">
      ${d.theory ? `<button class="primary mode-theory" id="m-theory"><span>📖 Сначала прочитать теорию</span><span>→</span></button>` : ""}
      <button class="mode" id="m-ticket"><span><strong>Билет</strong><small>${n} ${plural(n, "случайный вопрос", "случайных вопроса", "случайных вопросов")}</small></span><span class="arrow">→</span></button>
      <button class="mode" id="m-all"><span><strong>Все вопросы подряд</strong><small>${d.questions.length} в случайном порядке</small></span><span class="arrow">→</span></button>
      <button class="mode" id="m-new" ${fresh.length ? "" : "disabled"}><span><strong>Только новые</strong><small>${fresh.length} ещё не решали</small></span><span class="arrow">→</span></button>
      <button class="mode" id="m-bad" ${bad.length ? "" : "disabled"}><span><strong>Работа над ошибками</strong><small>${bad.length} с последней ошибкой</small></span><span class="arrow">→</span></button>
    </div>` + confirmBlock("deldeck", "Удалить тему", `Удалить тему «${esc(d.title)}» и ${d.questions.length} ${plural(d.questions.length, "вопрос", "вопроса", "вопросов")}? В этой копии её можно вернуть, только открыв новый файл от Claude.`);
  const back = {name: "deck", id: d.id};
  app.querySelector("#back").onclick = () => { view = {name: "subject", subj: d.subject}; render(); };
  wireConfirm("deldeck", async () => { const s = d.subject; await deleteDecks([d.id]); view = subjects().has(s) ? {name: "subject", subj: s} : {name: "home"}; render(); scrollTo(0, 0); });
  const th = app.querySelector("#m-theory"); if (th) th.onclick = () => { view = {name: "theory", id: d.id}; render(); scrollTo(0, 0); };
  app.querySelector("#m-ticket").onclick = () => startQuiz(shuffle(d.questions).slice(0, n), d.title, back);
  app.querySelector("#m-all").onclick = () => startQuiz(shuffle(d.questions), d.title, back);
  app.querySelector("#m-new").onclick = () => startQuiz(shuffle(fresh), d.title + " · новые", back);
  app.querySelector("#m-bad").onclick = () => startQuiz(shuffle(bad), d.title + " · ошибки", back);
}

function theoryHtml(src) {
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  const out = []; let kind = null, buf = [];
  const flush = () => {
    if (!buf.length) { kind = null; return; }
    if (kind === "ex") out.push(`<div class="ex">${buf.map(inl).join("\n")}</div>`);
    else if (kind === "ul") out.push(`<ul>${buf.map(l => `<li>${inl(l)}</li>`).join("")}</ul>`);
    else out.push(`<p>${buf.map(inl).join("<br>")}</p>`);
    buf = []; kind = null;
  };
  for (const raw of String(src).split("\n")) {
    const l = raw.trim();
    if (!l) { flush(); continue; }
    if (l.startsWith("## ")) { flush(); out.push(`<h2>${inl(l.slice(3))}</h2>`); continue; }
    if (l.startsWith("! ")) { flush(); out.push(`<div class="tip">${inl(l.slice(2))}</div>`); continue; }
    const k = l.startsWith(">") ? "ex" : l.startsWith("•") ? "ul" : "p";
    if (k !== kind) flush();
    kind = k; buf.push(k === "p" ? l : l.replace(/^[>•]\s?/, ""));
  }
  flush();
  return out.join("");
}

function renderTheory() {
  const d = decks.find(x => x.id === view.id);
  if (!d || !d.theory) { view = {name: "home"}; return render(); }
  app.innerHTML = `<div class="top"><button class="back" id="back">← К теме</button></div>
    <div class="eyebrow">${esc(d.subject)} · теория</div><h1>${esc(d.title)}</h1>
    <div class="theory">${theoryHtml(d.theory)}</div>
    <button class="primary" id="go"><span>Понятно — к вопросам</span><span>→</span></button>`;
  app.querySelector("#back").onclick = () => { view = {name: "deck", id: d.id}; render(); scrollTo(0, 0); };
  app.querySelector("#go").onclick = () => startQuiz(shuffle(d.questions), d.title, {name: "deck", id: d.id});
}

function startQuiz(list, title, back) {
  if (!list.length) return;
  view = {name: "quiz", title, back, items: list.map(q => ({q, order: shuffle(q.o.map((t, i) => i)), pick: null})), i: 0};
  render(); scrollTo(0, 0);
}

function renderQuiz() {
  const v = view, it = v.items[v.i], q = it.q;
  const answered = it.pick !== null;
  const strip = v.items.map((x, k) => {
    const cls = x.pick === null ? "" : (x.pick === x.q.a ? "ok" : "bad");
    return `<span class="cell ${cls} ${k === v.i ? "cur" : ""}">${k + 1}</span>`;
  }).join("");
  const opts = it.order.map((oi, k) => {
    let cls = "";
    if (answered) { if (oi === q.a) cls = "right"; else if (oi === it.pick) cls = "wrong"; }
    return `<button class="opt ${cls}" data-oi="${oi}" ${answered ? "disabled" : ""}><span class="k">${"АБВГДЕ"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
  let verdict = "";
  if (answered) {
    const ok = it.pick === q.a;
    verdict = `<div class="verdict ${ok ? "ok" : "bad"}"><b>${ok ? "Правильно" : "Неправильно"}</b>${ok ? "" : `<span>Верный ответ: ${esc(q.o[q.a])}</span>`}${q.e ? `<span class="muted">${esc(q.e)}</span>` : ""}</div>`;
  }
  const last = v.i === v.items.length - 1;
  app.innerHTML = `<div class="qhead"><button class="back" id="quit">← Выйти</button><span class="muted num">${v.i + 1} из ${v.items.length}</span></div>
    <div class="strip" id="strip">${strip}</div>
    <div class="qcard"><div class="eyebrow">${esc(v.title)}</div><div class="qtext">${esc(q.q)}</div><div class="opts">${opts}</div>${verdict}
    ${answered ? `<button class="primary" id="next"><span>${last ? "Результат" : "Следующий вопрос"}</span><span>→</span></button>` : ""}</div>`;
  const cur = app.querySelector(".cell.cur"); if (cur) cur.scrollIntoView({block: "nearest", inline: "center"});
  app.querySelector("#quit").onclick = () => finish();
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (it.pick !== null) return;
    it.pick = +b.dataset.oi;
    const ok = it.pick === q.a, p = prog[q.id] || [0, 0, 0, 0];
    prog[q.id] = [p[0] + (ok ? 1 : 0), p[1] + (ok ? 0 : 1), ok ? 1 : 0, Date.now()];
    saveProgress();
    renderQuiz();
    const nx = app.querySelector("#next"); if (nx) nx.scrollIntoView({block: "nearest", behavior: "smooth"});
  });
  const nx = app.querySelector("#next");
  if (nx) nx.onclick = () => { if (last) finish(); else { v.i++; renderQuiz(); scrollTo(0, 0); } };
}

function finish() {
  const done = view.items.filter(x => x.pick !== null);
  view = {name: "result", title: view.title, back: view.back, items: done};
  render(); scrollTo(0, 0);
}

function renderResult() {
  const v = view, right = v.items.filter(x => x.pick === x.q.a).length, wrong = v.items.filter(x => x.pick !== x.q.a);
  const pct = v.items.length ? Math.round(right / v.items.length * 100) : 0;
  let h = `<div class="eyebrow">${esc(v.title)}</div><h1>Результат</h1>
    <div><div class="score">${right} / ${v.items.length}</div><p class="muted">${v.items.length ? (pct === 100 ? "Без ошибок." : `${pct}% верно, ${wrong.length} ${plural(wrong.length, "ошибка", "ошибки", "ошибок")}.`) : "Вы не ответили ни на один вопрос."}</p></div>`;
  if (wrong.length) h += `<button class="primary" id="redo"><span>Повторить ошибки</span><span class="num">${wrong.length}</span></button>`;
  h += `<button class="mode" id="home"><span><strong>${v.back.name === "deck" ? "К теме" : "На главную"}</strong></span><span class="arrow">→</span></button>`;
  if (wrong.length) h += `<h2>Ошибки</h2>` + wrong.map(x => `<div class="mist"><span>${esc(x.q.q)}</span><span class="a">${esc(x.q.o[x.q.a])}</span>${x.q.e ? `<span class="note">${esc(x.q.e)}</span>` : ""}</div>`).join("");
  app.innerHTML = h;
  const r = app.querySelector("#redo"); if (r) r.onclick = () => startQuiz(shuffle(wrong.map(x => x.q)), v.title + " · ошибки", v.back);
  app.querySelector("#home").onclick = () => { view = v.back; render(); scrollTo(0, 0); };
}

// ---------- data (offline copy) ----------
const HIDE = "bilety-hidden-v1";
let hidden = []; try { hidden = JSON.parse(localStorage.getItem(HIDE) || "[]") || []; } catch (e) {}
decks = DECKS.filter(d => !hidden.includes(d.id));
loadState = "ready"; isOwner = true;
deleteDecks = async ids => {
  for (const id of ids) { const d = decks.find(x => x.id === id); if (d) d.questions.forEach(q => { delete prog[q.id]; }); hidden.push(id); }
  decks = decks.filter(x => !ids.includes(x.id));
  try { localStorage.setItem(HIDE, JSON.stringify(hidden)); } catch (e) {}
  saveProgress();
};
render();
})();
</script>
</body></html>
